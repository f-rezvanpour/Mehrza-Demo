<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>تقسیم فاکتور</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="./dc-lite.js" defer></script>
<style>html{background:#0b0705}@media(min-width:520px){body{display:flex;justify-content:center;padding:24px 0;min-height:100vh;box-sizing:border-box}x-dc{border-radius:38px;overflow:hidden;box-shadow:0 0 0 8px #1d1510,0 30px 80px rgba(0,0,0,.6);height:844px}}x-dc{display:block}</style>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
.cat{flex:none;height:36px;padding:0 15px;border-radius:18px;border:1.5px solid var(--line);background:var(--card);color:var(--mut);font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.cat.on{border-color:var(--ac);color:var(--ac)}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--mut);font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.tabs button.on{border-color:var(--ac);color:var(--ac)}
.stp{display:flex;align-items:center;gap:8px}
.stp button{width:34px;height:34px;border-radius:11px;border:1.5px solid var(--line);background:var(--card2);color:var(--tx);font:inherit;font-size:18px;font-weight:900;cursor:pointer}
.stp b{min-width:28px;text-align:center}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;color:var(--mut);font-weight:700;text-align:right;padding:6px 4px}
.tbl td{padding:9px 4px;border-top:1px solid var(--line)}
.tbl .n{text-align:left;direction:ltr;font-weight:800}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px}
.bars i{flex:1;border-radius:6px 6px 0 0;background:var(--ac);transition:height .4s;min-width:6px}
</style>
</helmet>
<div class="app a-gold" dir="rtl">
  <div class="glow"></div>
  <div class="bar rise">
    <a class="back tap" href="CashierPay.html" aria-label="بازگشت"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    <div class="f1"><h1 class="ttl">تقسیم فاکتور</h1><div class="sub t12 m">۳۲۵٬۰۰۰ تومان</div></div>
  </div>
  <div class="scroll">
    <div class="tabs rise d1"><button type="button" class="{{c0}}" onClick="{{t0}}">مساوی</button><button type="button" class="{{c1}}" onClick="{{t1}}">بر اساس آیتم</button></div>
    <sc-if value="{{eq}}" hint-placeholder-val="{{true}}"><div class="card hero rise d2"><div class="fx ai jb"><b class="t14">تعداد نفرات</b><div class="stp"><button type="button" onClick="{{less}}" aria-label="کم">−</button><b>{{n}}</b><button type="button" onClick="{{more}}" aria-label="زیاد">+</button></div></div><div class="kv"><span class="m">سهم هر نفر</span><b class="t18 w9 gold">{{each}}</b></div></div></sc-if>
    <sc-if value="{{byItem}}" hint-placeholder-val="{{false}}"><sc-for list="{{items}}" as="i" hint-placeholder-count="3"><div class="item rise d2"><div class="f1"><b class="t14 w8">{{i.n}}</b><div class="t12 m">{{i.p}}</div></div><button type="button" class="btn ghost tap" style="flex:none;height:36px;padding:0 16px;font-size:13px;border-radius:12px" onClick="{{i.sw}}">{{i.who}}</button></div></sc-for>
      <div class="grid2"><div class="card tc" style="padding:12px"><div class="t12 m">نفر الف</div><div class="t18 w9 gold">{{a}}</div></div><div class="card tc" style="padding:12px"><div class="t12 m">نفر ب</div><div class="t18 w9 gold">{{b}}</div></div></div></sc-if>
    <a href="CashierPay.html" class="btn tap rise d3" style="flex:none">پرداخت نفر اول</a>
  </div>
  <nav class="dock" aria-label="ناوبری">
    <a href="CashierPOS.html" class="on"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10l1-5h14l1 5"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg></span>صندوق</a>
    <a href="CashierOrders.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 9h6M9 13h6M9 17h3"/></svg></span>سفارش‌ها</a>
    <a href="CashClose.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></span>بستن صندوق</a>
    <a href="StaffHome.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-6 8-6s8 2 8 6"/></svg></span>کارمند</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { t: 0, n: 2, w: [0, 1, 0] }; }
  renderVals() {
    const fa = (n) => String(n).replace(/\d/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]);
    const fmt = (n) => fa(Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '٬'));
    const I = [['آمریکانو', 95000], ['آمریکانو', 95000], ['چیزکیک', 135000]];
    const s = this.state;
    const a = I.reduce((x, it, i) => x + (s.w[i] === 0 ? it[1] : 0), 0), b = 325000 - a;
    return { c0: s.t === 0 ? 'on' : '', c1: s.t === 1 ? 'on' : '', t0: () => this.setState({ t: 0 }), t1: () => this.setState({ t: 1 }), eq: s.t === 0, byItem: s.t === 1,
      n: fa(s.n), each: fmt(325000 / s.n) + ' تومان', less: () => this.setState({ n: Math.max(2, this.state.n - 1) }), more: () => this.setState({ n: Math.min(10, this.state.n + 1) }),
      items: I.map((it, i) => ({ n: it[0], p: fmt(it[1]), who: s.w[i] === 0 ? 'الف' : 'ب', sw: () => { const w = this.state.w.slice(); w[i] = w[i] ? 0 : 1; this.setState({ w }); } })), a: fmt(a), b: fmt(b) };
  }
}
</script>
</body>
</html>
