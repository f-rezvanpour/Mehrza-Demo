<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>منوی مهرزا</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="./dc-lite.js" defer></script>
<style>html{background:#0b0705}@media(min-width:520px){body{display:flex;justify-content:center;padding:24px 0;min-height:100vh;box-sizing:border-box}x-dc{border-radius:38px;overflow:hidden;box-shadow:0 0 0 8px #1d1510,0 30px 80px rgba(0,0,0,.6);height:844px}}x-dc{display:block}</style>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
.fld{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--mut);font-weight:600}
.fld input,.fld select{height:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--card2);color:var(--tx);padding:0 14px;font:inherit;font-size:15px;outline:0;width:100%;box-sizing:border-box}
.fld input:focus,.fld select:focus{border-color:var(--ac)}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--mut);font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.tabs button.on{border-color:var(--ac);color:var(--ac)}
.stp{display:flex;align-items:center;gap:8px}
.stp button{width:34px;height:34px;border-radius:11px;border:1.5px solid var(--line);background:var(--card2);color:var(--tx);font:inherit;font-size:18px;font-weight:900;cursor:pointer}
.stp b{min-width:28px;text-align:center}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;color:var(--mut);font-weight:700;text-align:right;padding:6px 4px}
.tbl td{padding:9px 4px;border-top:1px solid var(--line)}
.tbl .n{text-align:left;direction:ltr;font-weight:800}
.cat{flex:none;height:38px;padding:0 16px;border-radius:19px;border:1.5px solid var(--line);background:var(--card);color:var(--mut);font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.cat.on{border-color:var(--ac);color:var(--ac)}
.cart{margin:0 16px 14px;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-radius:20px;background:var(--ac);color:#1B120D;font-weight:900}

</style>
</helmet>
<div class="app a-gold" dir="rtl">
  <div class="glow"></div>
  <div class="bar rise">
    <a class="back tap" href="AppHome.html" aria-label="بازگشت"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    <div class="f1"><h1 class="ttl">منوی مهرزا</h1><div class="sub t12 m">شعبه ونک، آماده‌سازی حدود ۸ دقیقه</div></div>
  </div>
  <div class="scroll">
    <div class="fx g8 rise d1" style="overflow-x:auto;padding-bottom:4px">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="4"><button type="button" class="cat tap {{c.cls}}" onClick="{{c.pick}}">{{c.name}}</button></sc-for>
    </div>
    <sc-for list="{{items}}" as="p" hint-placeholder-count="6">
      <div class="item rise d2">
        <span class="blob" style="background:{{p.col}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h13v5a5 5 0 01-5 5H9a5 5 0 01-5-5z"/><path d="M17 9h2a2 2 0 010 4h-2"/></svg></span>
        <div class="f1"><a href="AppProduct.html" class="t14 w8" style="display:block;font-weight:800">{{p.name}}</a><div class="t12 m">{{p.desc}}</div><b class="t13 acc">{{p.price}} تومان</b></div>
        <div class="stp"><button type="button" onClick="{{p.minus}}" aria-label="کم کن">−</button><b>{{p.q}}</b><button type="button" onClick="{{p.plus}}" aria-label="اضافه کن">+</button></div>
      </div>
    </sc-for>
  </div>
  <sc-if value="{{has}}" hint-placeholder-val="{{false}}"><a href="AppCart.html" class="cart tap pop"><span>{{count}} آیتم، مشاهده سبد</span><span>{{total}} تومان</span></a></sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { q: {}, cat: 'همه' }; }
  renderVals() {
    const fa = (n) => String(n).replace(/\d/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]);
    const fmt = (n) => fa(Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '٬'));
    const P = [
      { id: 'esp', name: 'اسپرسو', cat: 'قهوه', price: 70000, desc: 'دان ۱۰۰٪ عربیکا، دوبل', col: '#E8B25C' },
      { id: 'ame', name: 'آمریکانو', cat: 'قهوه', price: 95000, desc: 'اسپرسو با آب داغ', col: '#EE8F66' },
      { id: 'lat', name: 'لاته', cat: 'قهوه', price: 120000, desc: 'اسپرسو و شیر بخارداده', col: '#F5A1BB' },
      { id: 'cap', name: 'کاپوچینو', cat: 'قهوه', price: 115000, desc: 'فوم شیر غلیظ', col: '#B8ABF7' },
      { id: 'v60', name: 'وی‌شصت', cat: 'دمی', price: 130000, desc: 'دم‌آوری قطره‌ای تک‌origin', col: '#8CCBE0' },
      { id: 'cak', name: 'چیزکیک', cat: 'شیرینی', price: 135000, desc: 'توت‌فرنگی و بیسکویت', col: '#F5A1BB' },
      { id: 'cro', name: 'کروسان', cat: 'شیرینی', price: 80000, desc: 'کره‌ای، تازه از فر', col: '#E8B25C' }
    ];
    const q = this.state.q;
    const set = (id, d) => () => { const n = Object.assign({}, this.state.q); n[id] = Math.max(0, (n[id] || 0) + d); this.setState({ q: n }); };
    const cats = ['همه', 'قهوه', 'دمی', 'شیرینی'];
    const sel = this.state.cat;
    const list = P.filter((p) => sel === 'همه' || p.cat === sel);
    let count = 0, total = 0;
    P.forEach((p) => { const n = q[p.id] || 0; count += n; total += n * p.price; });
    return {
      cats: cats.map((c) => ({ name: c, cls: c === sel ? 'on' : '', pick: () => this.setState({ cat: c }) })),
      items: list.map((p) => ({ name: p.name, desc: p.desc, col: p.col, price: fmt(p.price), q: fa(q[p.id] || 0), plus: set(p.id, 1), minus: set(p.id, -1) })),
      has: count > 0, count: fa(count), total: fmt(total)
    };
  }
}
</script>
</body>
</html>
