<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>سبد خرید</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="./dc-lite.js" defer></script>
<style>html{background:#0b0705}@media(min-width:520px){body{display:flex;justify-content:center;padding:24px 0;min-height:100vh;box-sizing:border-box}x-dc{border-radius:38px;overflow:hidden;box-shadow:0 0 0 8px #1d1510,0 30px 80px rgba(0,0,0,.6);height:844px}}x-dc{display:block}</style>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
.fld{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--mut);font-weight:600}
.fld input,.fld select{height:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--card2);color:var(--tx);padding:0 14px;font:inherit;font-size:15px;outline:0;width:100%;box-sizing:border-box}
.fld input:focus,.fld select:focus{border-color:var(--ac)}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--mut);font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.tabs button.on{border-color:var(--ac);color:var(--ac)}
.stp{display:flex;align-items:center;gap:8px}
.stp button{width:34px;height:34px;border-radius:11px;border:1.5px solid var(--line);background:var(--card2);color:var(--tx);font:inherit;font-size:18px;font-weight:900;cursor:pointer}
.stp b{min-width:28px;text-align:center}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;color:var(--mut);font-weight:700;text-align:right;padding:6px 4px}
.tbl td{padding:9px 4px;border-top:1px solid var(--line)}
.tbl .n{text-align:left;direction:ltr;font-weight:800}
.chk2{width:100%;text-align:right;color:var(--tx);cursor:pointer}
.chk2.on{border-color:#8FD3A4;background:rgba(143,211,164,.1)}
</style>
</helmet>
<div class="app a-gold" dir="rtl">
  <div class="glow"></div>
  <div class="bar rise">
    <a class="back tap" href="AppMenu.html" aria-label="بازگشت"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    <div class="f1"><h1 class="ttl">سبد خرید</h1><div class="sub t12 m">سفارش از اپ، تحویل در کافه</div></div>
  </div>
  <div class="scroll">
    <div class="card rise d1" style="padding:4px 16px">
      <div class="kv"><div><b>آمریکانو</b><div class="t12 m">یک عدد</div></div><b>۹۵٬۰۰۰</b></div>
      <div class="kv"><div><b>لاته</b><div class="t12 m">یک عدد</div></div><b>۱۲۰٬۰۰۰</b></div>
    </div>
    <div class="item rise d2"><span class="blob"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10l1-5h14l1 5"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg></span><div class="f1"><b class="t14 w8">شعبه ونک</b><div class="t12 m">باریستا: علی کرمی، شیفت عصر</div></div><span class="pill p-ok">باز است</span></div>
    <a href="AppSchedule.html" class="item tap rise d2"><span class="blob" style="background:#8CCBE0"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg></span><div class="f1"><b class="t14 w8">زمان تحویل</b><div class="t12 m">همین الان، یا زمان دلخواه</div></div><svg class="i m" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    <button type="button" class="item chk2 tap {{cls}}" onClick="{{toggle}}"><span class="blob" style="background:#8FD3A4"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="10" rx="2"/><path d="M12 7v10" stroke-dasharray="2 3"/></svg></span><div class="f1"><b class="t14 w8">کد تخفیف ۳٪</b><div class="t12 m" style="direction:ltr;text-align:right">MEHRZA-3-K7Q2</div></div><span class="pill {{pc}}">{{pt}}</span></button>
    <div class="card rise d3" style="padding:4px 16px">
      <div class="kv"><span class="m">جمع</span><b>۲۱۵٬۰۰۰</b></div>
      <div class="kv"><span class="m">تخفیف</span><b class="sage">{{disc}}</b></div>
      <div class="kv"><b class="t15">مبلغ قابل پرداخت</b><b class="t18 w9 gold">{{total}}</b></div>
    </div>
    <div class="t12 m tc">با پرداخت، <b class="acc">{{pts}} امتیاز</b> به باشگاه شما اضافه می‌شود.</div>
    <a href="AppTrack.html" class="btn tap rise d4" style="flex:none">پرداخت و ثبت سفارش</a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { on: true }; }
  renderVals() {
    const fa = (n) => String(n).replace(/\d/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]);
    const fmt = (n) => fa(Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '٬'));
    const on = this.state.on;
    const d = on ? 6450 : 0;
    const t = 215000 - d;
    return { cls: on ? 'on' : '', pc: on ? 'p-ok' : 'p-info', pt: on ? 'اعمال شد' : 'اعمال کن', disc: on ? '−' + fmt(d) : '۰', total: fmt(t) + ' تومان', pts: fa(Math.round(t / 10000)), toggle: () => this.setState({ on: !this.state.on }) };
  }
}
</script>
</body>
</html>
