<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>تیم امروز</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="./dc-lite.js" defer></script>
<style>html{background:#0b0705}@media(min-width:520px){body{display:flex;justify-content:center;padding:24px 0;min-height:100vh;box-sizing:border-box}x-dc{border-radius:38px;overflow:hidden;box-shadow:0 0 0 8px #1d1510,0 30px 80px rgba(0,0,0,.6);height:844px}}x-dc{display:block}</style>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0}

</style>
</helmet>
<div class="app a-sky" dir="rtl">
  <div class="glow"></div>
  <div class="bar rise">
    <a class="back tap" href="BMHome.html" aria-label="بازگشت"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    <div class="f1"><h1 class="ttl">تیم امروز</h1><div class="sub t12 m">شعبه ونک</div></div>
  </div>
  <div class="scroll">
    <div class="card hero rise d1" style="border-color:#8CCBE0"><div class="t12 m">سفارش‌ها روی این نفر ثبت می‌شود</div><div class="fx ai g10" style="margin-top:6px"><div class="av">{{ini}}</div><b class="t18 w9">{{cur}}</b></div></div>
    <sc-for list="{{rows}}" as="p" hint-placeholder-count="4"><div class="item rise d2"><div class="av">{{p.i}}</div><div class="f1"><b class="t14 w8">{{p.n}}</b><div class="t12 m">{{p.t}}</div></div><button type="button" class="btn ghost tap" style="flex:none;height:36px;padding:0 12px;font-size:12px;border-radius:12px;{{p.sty}}" onClick="{{p.pick}}">{{p.btn}}</button></div></sc-for>
    <div class="t12 m tc">اگر شیفت‌دار فعلی برود یا استراحت کند، مدیر شعبه یا خود او می‌تواند مسئول را عوض کند.</div>
  </div>
  <nav class="dock" aria-label="ناوبری">
    <a href="BMHome.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg></span>خانه</a>
    <a href="BMTeam.html" class="on"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-6 8-6s8 2 8 6"/></svg></span>تیم</a>
    <a href="BMStock.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5L12 12l9-4.5M12 12v9"/></svg></span>موجودی</a>
    <a href="PettyCash.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></span>تنخواه</a>
    <a href="AdminApprovals.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>تایید</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { c: 0 }; }
  renderVals() {
    const P = [['علی کرمی', 'ع', 'ورود ۱۳:۵۹، باریستا'], ['سارا نوری', 'س', 'ورود ۱۴:۰۰، باریستا'], ['نگار عباسی', 'ن', 'ورود ۱۳:۴۵، صندوق‌دار'], ['رضا اکبری', 'ر', 'مرخصی']];
    const c = this.state.c;
    return { cur: P[c][0], ini: P[c][1], rows: P.map((p, i) => ({ n: p[0], i: p[1], t: p[2], btn: i === c ? 'مسئول فعلی' : (i === 3 ? 'غایب' : 'انتخاب'), sty: i === c ? 'border-color:#8CCBE0;color:#8CCBE0' : '', pick: () => { if (i !== 3) this.setState({ c: i }); } })) };
  }
}
</script>
</body>
</html>
