<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>جزئیات چک</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="./dc-lite.js" defer></script>
<style>html{background:#0b0705}@media(min-width:520px){body{display:flex;justify-content:center;padding:24px 0;min-height:100vh;box-sizing:border-box}x-dc{border-radius:38px;overflow:hidden;box-shadow:0 0 0 8px #1d1510,0 30px 80px rgba(0,0,0,.6);height:844px}}x-dc{display:block}</style>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
.vs{position:relative;padding-inline-start:40px;min-height:44px}
.vs::before{content:"";position:absolute;inset-inline-start:14px;top:30px;bottom:-6px;width:3px;background:var(--line)}
.vs:last-child::before{display:none}
.vs .pt{position:absolute;inset-inline-start:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--card2);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.vs.done .pt{background:#8FD3A4;border-color:#8FD3A4}
.vs.bad .pt{background:#F08A8A;border-color:#F08A8A}
.vs .tt{font-weight:700}
</style>
</helmet>
<div class="app a-sage" dir="rtl">
  <div class="glow"></div>
  <div class="bar rise">
    <a class="back tap" href="ChequeList.html" aria-label="بازگشت"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    <div class="f1"><h1 class="ttl">چک ۱۲۸۴۵۶۷۸۹۰۱۲</h1><div class="sub t12 m">شرکت رستوران‌دار پارس، ۴۵٬۰۰۰٬۰۰۰ تومان</div></div>
  </div>
  <div class="scroll">
    <div class="card hero rise d1 tc"><span class="pill {{pc}}">{{pt}}</span><div class="t12 m" style="margin-top:6px">سررسید ۱۲ آبان ۱۴۰۵، بانک ملی</div></div>
    <div class="card rise d2" style="padding:16px">
      <div class="fc g16">
        <div class="vs done"><span class="pt"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px;stroke-width:3"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><div class="tt t14">دریافت چک، ۲۵ مهر</div><div class="t12 m">بدهکار اسناد دریافتنی</div></div>
        <div class="vs {{c2}}"><span class="pt"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px;stroke-width:3"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><div class="tt t14">{{last}}</div><div class="t12 m">{{lastSub}}</div></div>
      </div>
    </div>
    <sc-if value="{{act}}" hint-placeholder-val="{{true}}"><div class="fx g10 rise d3"><button type="button" class="btn tap" onClick="{{ok}}">وصول شد</button><button type="button" class="btn ghost tap" onClick="{{bad}}">برگشت خورد</button></div></sc-if>
    <sc-if value="{{done}}" hint-placeholder-val="{{false}}"><div class="card pop" style="border-color:rgba(143,211,164,.5)"><b class="t14 w8">سند ثبت‌شده</b><div class="kv"><span>{{dr}}</span><b>۴۵٬۰۰۰٬۰۰۰</b></div><div class="kv"><span>{{cr}}</span><b>۴۵٬۰۰۰٬۰۰۰</b></div></div></sc-if>
  </div>
  <nav class="dock" aria-label="ناوبری">
    <a href="Main.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg></span>خانه</a>
    <a href="AcctHome.html" class="on"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></span>حسابداری</a>
    <a href="InvKardex.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5L12 12l9-4.5M12 12v9"/></svg></span>انبار</a>
    <a href="ProdList.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h13v5a5 5 0 01-5 5H9a5 5 0 01-5-5z"/><path d="M17 9h2a2 2 0 010 4h-2"/></svg></span>محصولات</a>
    <a href="Branches.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10l1-5h14l1 5"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg></span>شعبه‌ها</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { s: 0 }; }
  renderVals() {
    const s = this.state.s;
    return {
      pt: ['در جریان وصول', 'وصول شد', 'برگشت خورد'][s], pc: ['p-warn', 'p-ok', 'p-bad'][s],
      c2: s === 1 ? 'done' : (s === 2 ? 'bad' : ''), last: ['منتظر سررسید', 'وصول به حساب بانک ملت', 'برگشت از بانک'][s],
      lastSub: ['۱۲ آبان، ۵ روز دیگر', 'بدهکار بانک', 'مشتری به لیست پیگیری رفت'][s],
      act: s === 0, done: s !== 0,
      dr: s === 1 ? 'بدهکار: بانک ملت' : 'بدهکار: حساب‌های دریافتنی', cr: s === 1 ? 'بستانکار: اسناد دریافتنی' : 'بستانکار: اسناد دریافتنی (برگشتی)',
      ok: () => this.setState({ s: 1 }), bad: () => this.setState({ s: 2 })
    };
  }
}
</script>
</body>
</html>
