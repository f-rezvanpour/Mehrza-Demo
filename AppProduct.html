<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>سفارشی‌سازی نوشیدنی</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="./dc-lite.js" defer></script>
<style>html{background:#0b0705}@media(min-width:520px){body{display:flex;justify-content:center;padding:24px 0;min-height:100vh;box-sizing:border-box}x-dc{border-radius:38px;overflow:hidden;box-shadow:0 0 0 8px #1d1510,0 30px 80px rgba(0,0,0,.6);height:844px}}x-dc{display:block}</style>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
.fld{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--mut);font-weight:600}
.fld input,.fld select{height:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--card2);color:var(--tx);padding:0 14px;font:inherit;font-size:15px;outline:0;width:100%;box-sizing:border-box}
.fld input:focus,.fld select:focus{border-color:var(--ac)}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--mut);font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.tabs button.on{border-color:var(--ac);color:var(--ac)}
.stp{display:flex;align-items:center;gap:8px}
.stp button{width:34px;height:34px;border-radius:11px;border:1.5px solid var(--line);background:var(--card2);color:var(--tx);font:inherit;font-size:18px;font-weight:900;cursor:pointer}
.stp b{min-width:28px;text-align:center}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;color:var(--mut);font-weight:700;text-align:right;padding:6px 4px}
.tbl td{padding:9px 4px;border-top:1px solid var(--line)}
.tbl .n{text-align:left;direction:ltr;font-weight:800}
.opt{flex:none;min-height:42px;padding:6px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--mut);font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.opt.on{border-color:var(--ac);color:var(--ac)}
</style>
</helmet>
<div class="app a-rose" dir="rtl">
  <div class="glow"></div>
  <div class="bar rise">
    <a class="back tap" href="AppMenu.html" aria-label="بازگشت"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    <div class="f1"><h1 class="ttl">لاته</h1><div class="sub t12 m">اسپرسو و شیر بخارداده</div></div>
  </div>
  <div class="scroll">
    <div class="card hero rise d1 tc"><svg viewBox="0 0 120 100" width="120" height="100" aria-hidden="true"><path d="M26 28h62v26a24 24 0 01-24 24H50a24 24 0 01-24-24z" fill="#F6EBDD"/><path d="M88 36h8a10 10 0 010 22h-8" fill="none" stroke="#F6EBDD" stroke-width="7"/><path d="M26 40h62" stroke="#B5773A" stroke-width="12"/><path class="steam s1" d="M45 20c-5-6 5-9 0-15" stroke="#F6EBDD" stroke-width="3" fill="none" stroke-linecap="round"/><path class="steam s2" d="M62 20c-5-6 5-9 0-15" stroke="#F6EBDD" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
      <div class="fx jc g8" style="margin-top:6px"><span class="pill p-info">{{kcal}} کالری</span><span class="pill p-warn">لبنیات</span><span class="pill p-warn">کافئین</span></div></div>
    <div class="card rise d2 fc g10"><b class="t14 w8">سایز</b><div class="fx g8"><sc-for list="{{size}}" as="o" hint-placeholder-count="3"><button type="button" class="opt tap {{o.cls}}" onClick="{{o.pick}}">{{o.n}}</button></sc-for></div></div>
    <div class="card rise d3 fc g10"><b class="t14 w8">نوع شیر</b><div class="fx g8" style="flex-wrap:wrap"><sc-for list="{{milk}}" as="o" hint-placeholder-count="4"><button type="button" class="opt tap {{o.cls}}" onClick="{{o.pick}}">{{o.n}}</button></sc-for></div></div>
    <div class="card rise d4 fc g10"><b class="t14 w8">شکر</b><div class="fx g8"><sc-for list="{{sugar}}" as="o" hint-placeholder-count="4"><button type="button" class="opt tap {{o.cls}}" onClick="{{o.pick}}">{{o.n}}</button></sc-for></div></div>
    <div class="card rise d5"><div class="fx ai jb"><div><b class="t14 w8">شات اضافه</b><div class="t12 m">۲۵٬۰۰۰ تومان</div></div><div class="stp"><button type="button" onClick="{{lessS}}" aria-label="کم">−</button><b>{{shots}}</b><button type="button" onClick="{{moreS}}" aria-label="زیاد">+</button></div></div></div>
    <a href="AppMenu.html" class="btn tap rise d6" style="flex:none;justify-content:space-between;padding:0 20px"><span>افزودن به سبد</span><span>{{total}}</span></a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { s: 1, m: 0, g: 1, x: 0 }; }
  renderVals() {
    const fa = (n) => String(n).replace(/\d/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]);
    const fmt = (n) => fa(Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '٬'));
    const S = [['کوچک', -15000, -40], ['متوسط', 0, 0], ['بزرگ', 25000, 60]];
    const M = [['معمولی', 0], ['بادام', 20000], ['جو', 20000], ['بدون لاکتوز', 15000]];
    const G = ['بدون', '۱ قاشق', '۲ قاشق', '۳ قاشق'];
    const s = this.state;
    const total = 120000 + S[s.s][1] + M[s.m][1] + s.x * 25000;
    const set = (k, v) => () => { const o = {}; o[k] = v; this.setState(o); };
    return {
      size: S.map((o, i) => ({ n: o[0] + (o[1] ? ' ' + (o[1] > 0 ? '+' : '−') + fmt(Math.abs(o[1])) : ''), cls: i === s.s ? 'on' : '', pick: set('s', i) })),
      milk: M.map((o, i) => ({ n: o[0] + (o[1] ? ' +' + fmt(o[1]) : ''), cls: i === s.m ? 'on' : '', pick: set('m', i) })),
      sugar: G.map((n, i) => ({ n, cls: i === s.g ? 'on' : '', pick: set('g', i) })),
      shots: fa(s.x), lessS: () => this.setState({ x: Math.max(0, this.state.x - 1) }), moreS: () => this.setState({ x: Math.min(3, this.state.x + 1) }),
      total: fmt(total) + ' تومان', kcal: fa(180 + S[s.s][2] + s.g * 20 + (s.m === 0 ? 0 : -20))
    };
  }
}
</script>
</body>
</html>
