<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>سفارش‌های امروز</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="./dc-lite.js" defer></script>
<style>html{background:#0b0705}@media(min-width:520px){body{display:flex;justify-content:center;padding:24px 0;min-height:100vh;box-sizing:border-box}x-dc{border-radius:38px;overflow:hidden;box-shadow:0 0 0 8px #1d1510,0 30px 80px rgba(0,0,0,.6);height:844px}}x-dc{display:block}</style>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0}

</style>
</helmet>
<div class="app a-gold" dir="rtl">
  <div class="glow"></div>
  <div class="bar rise">
    <a class="back tap" href="CashierPOS.html" aria-label="بازگشت"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    <div class="f1"><h1 class="ttl">سفارش‌های امروز</h1><div class="sub t12 m">ابطال و برگشت وجه با تایید مدیر</div></div>
  </div>
  <div class="scroll">
    <sc-for list="{{rows}}" as="o" hint-placeholder-count="4">
      <div class="card rise d2">
        <div class="fx ai jb"><b class="t15 w9">سفارش {{o.no}}</b><span class="pill {{o.pc}}">{{o.st}}</span></div>
        <div class="t12 m" style="margin:2px 0 6px">{{o.desc}}</div>
        <div class="fx ai jb"><b class="gold">{{o.amt}}</b><button type="button" class="btn ghost tap" style="flex:none;height:38px;padding:0 14px;font-size:12.5px;border-radius:12px" onClick="{{o.act}}">{{o.btn}}</button></div>
      </div>
    </sc-for>
  </div>
  <nav class="dock" aria-label="ناوبری">
    <a href="CashierPOS.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10l1-5h14l1 5"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg></span>صندوق</a>
    <a href="CashierOrders.html" class="on"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 9h6M9 13h6M9 17h3"/></svg></span>سفارش‌ها</a>
    <a href="CashClose.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></span>بستن صندوق</a>
    <a href="StaffHome.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-6 8-6s8 2 8 6"/></svg></span>کارمند</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { s: [0, 0, 0, 0] }; }
  renderVals() {
    const O = [['۱۰۴۳', 'آمریکانو ×۲، چیزکیک، نقد', '۳۲۵٬۰۰۰'], ['۱۰۴۲', 'آمریکانو، لاته، از اپ', '۲۰۹٬۵۵۰'], ['۱۰۴۱', 'کاپوچینو ×۲، کارت', '۲۳۰٬۰۰۰'], ['۱۰۴۰', 'وی‌شصت، از اپ', '۱۳۰٬۰۰۰']];
    const ST = [['پرداخت شد', 'p-ok', 'درخواست ابطال'], ['منتظر تایید مدیر', 'p-warn', 'لغو درخواست'], ['باطل شد، وجه برگشت', 'p-bad', 'باطل‌شده']];
    return { rows: O.map((o, i) => { const k = this.state.s[i]; return { no: o[0], desc: o[1], amt: o[2] + ' تومان', st: ST[k][0], pc: ST[k][1], btn: ST[k][2], act: () => { const a = this.state.s.slice(); if (a[i] === 0) a[i] = 1; else if (a[i] === 1) a[i] = 0; this.setState({ s: a }); } }; }) };
  }
}
</script>
</body>
</html>
