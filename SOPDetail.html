<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>چک‌لیست SOP</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="./dc-lite.js" defer></script>
<style>html{background:#0b0705}@media(min-width:520px){body{display:flex;justify-content:center;padding:24px 0;min-height:100vh;box-sizing:border-box}x-dc{border-radius:38px;overflow:hidden;box-shadow:0 0 0 8px #1d1510,0 30px 80px rgba(0,0,0,.6);height:844px}}x-dc{display:block}</style>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
.step{width:100%;text-align:right;color:var(--tx);cursor:pointer;font-size:14.5px}
.step .box{width:30px;height:30px;border-radius:10px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink);transition:background .25s,border-color .25s}
.step.done{border-color:rgba(238,143,102,.5);background:rgba(238,143,102,.1)}
.step.done .box{background:#EE8F66;border-color:#EE8F66}
.step.done .txt{color:var(--mut);text-decoration:line-through}
</style>
</helmet>
<div class="app a-ter" dir="rtl">
  <div class="glow"></div>
  <div class="bar rise">
    <a class="back tap" href="SOP.html" aria-label="بازگشت به کتابخانه"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    <div class="f1"><h1 class="ttl" style="font-size:19px">تمیزکاری دستگاه اسپرسو</h1><div class="sub t12 m">هر مرحله را که انجام دادی لمس کن</div></div>
  </div>

  <div class="scroll">
    <div class="card hero rise d1">
      <div class="fx ai g16">
        <div class="rel" style="width:92px;height:92px;flex:none">
          <svg viewBox="0 0 92 92" width="92" height="92" aria-hidden="true">
            <circle cx="46" cy="46" r="38" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="9"/>
            <circle cx="46" cy="46" r="38" fill="none" stroke="#EE8F66" stroke-width="9" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="{{ringOffset}}" transform="rotate(-90 46 46)" style="transition:stroke-dashoffset .5s ease"/>
          </svg>
          <div class="fc jc ai tc" style="position:absolute;inset:0"><div class="t20 w9" style="line-height:1.1">{{doneFa}}</div><div class="t11 m">از ۶</div></div>
        </div>
        <div class="f1">
          <div class="t16 w8">{{headline}}</div>
          <div class="t12 m">با تکمیل همه مراحل، نتیجه برای مدیر ثبت می‌شود.</div>
        </div>
      </div>
    </div>

    <sc-for list="{{steps}}" as="s" hint-placeholder-count="6">
      <button type="button" class="item step tap {{s.cls}}" onClick="{{s.toggle}}">
        <span class="box"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px;stroke-width:3"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
        <span class="txt f1"><b class="acc">{{s.n}}.</b> {{s.text}}</span>
      </button>
    </sc-for>

    <sc-if value="{{allDone}}" hint-placeholder-val="{{false}}">
      <div class="card pop tc" style="border-color:#8FD3A4">
        <div class="t16 w8 sage">آفرین، همه مراحل کامل شد</div>
        <div class="t12 m">ساعت ۱۳:۵۲ برای مدیر ثبت شد</div>
      </div>
    </sc-if>

    <div class="fx g10 rise d3">
      <a href="SOP.html" class="btn tap">ثبت و بازگشت</a>
      <a href="SOPTraining.html" class="btn ghost tap">آموزش تصویری</a>
    </div>
  </div>

  <nav class="dock" aria-label="ناوبری SOP">
    <a href="Main.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg></span>خانه</a>
    <a href="SOP.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg></span>کتابخانه</a>
    <a href="SOPDetail.html" class="on"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>چک‌لیست</a>
    <a href="SOPVersions.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg></span>نسخه‌ها</a>
    <a href="SOPTraining.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h13v5a5 5 0 01-5 5H9a5 5 0 01-5-5z"/></svg></span>آموزش</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: [true, false, false, false, false, false] };
  }
  renderVals() {
    const fa = (n) => String(n).replace(/\d/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]);
    const texts = [
      'دستگاه را خاموش کن و بخار را تخلیه کن',
      'پورتافیلتر و سبد را جدا کن و بشوی',
      'گروه جوش را با برس مخصوص تمیز کن',
      'لوله بخار را با دستمال مرطوب پاک کن',
      'سینی آبچکان را خالی و شستشو کن',
      'ساعت انجام را ثبت کن'
    ];
    const done = this.state.done;
    const count = done.filter(Boolean).length;
    return {
      steps: texts.map((text, i) => ({
        n: fa(i + 1),
        text,
        cls: done[i] ? 'done' : '',
        toggle: () => {
          const next = this.state.done.slice();
          next[i] = !next[i];
          this.setState({ done: next });
        }
      })),
      doneFa: fa(count),
      ringOffset: String(100 - Math.round((count / 6) * 100)),
      headline: count === 6 ? 'همه چیز تمیز است' : fa(6 - count) + ' مرحله مانده',
      allDone: count === 6
    };
  }
}
</script>
</body>
</html>
