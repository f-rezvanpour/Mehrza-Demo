<style>
body{margin:0}
.fld{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--mut);font-weight:600}
.fld input,.fld select{height:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--card2);color:var(--tx);padding:0 14px;font:inherit;font-size:15px;outline:0;width:100%;box-sizing:border-box}
.fld input:focus,.fld select:focus{border-color:var(--ac)}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--mut);font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.tabs button.on{border-color:var(--ac);color:var(--ac)}
.stp{display:flex;align-items:center;gap:8px}
.stp button{width:34px;height:34px;border-radius:11px;border:1.5px solid var(--line);background:var(--card2);color:var(--tx);font:inherit;font-size:18px;font-weight:900;cursor:pointer}
.stp b{min-width:28px;text-align:center}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;color:var(--mut);font-weight:700;text-align:right;padding:6px 4px}
.tbl td{padding:9px 4px;border-top:1px solid var(--line)}
.tbl .n{text-align:left;direction:ltr;font-weight:800}

</style>
</helmet>
<div class="app a-sky" dir="rtl">
  <div class="glow"></div>
  <div class="bar rise">
    <a class="back tap" href="Branches.html" aria-label="بازگشت"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    <div class="f1"><h1 class="ttl">شعبه جدید</h1><div class="sub t12 m">اطلاعات اولیه</div></div>
  </div>
  <div class="scroll">
    <div class="card rise d1 fc g12">
      <label class="fld"><span>نام شعبه</span><input type="text" placeholder="مثلا مهرزا الهیه"></label>
      <label class="fld"><span>آدرس</span><input type="text" placeholder="شهر، خیابان، پلاک"></label>
      <div class="grid2" style="gap:10px">
        <label class="fld"><span>ساعت شروع کار</span><input type="text" value="۰۸:۰۰"></label>
        <label class="fld"><span>ساعت پایان کار</span><input type="text" value="۲۳:۰۰"></label>
      </div>
      <label class="fld"><span>سرپرست شعبه</span><select><option>انتخاب کن</option><option>مهدی صادقی</option><option>سارا نوری</option></select></label>
    </div>
    <div class="card rise d2 fc g12">
      <b class="t14 w8">شبکه Wi-Fi برای ثبت حضور</b>
      <label class="fld"><span>نام شبکه (SSID)</span><input type="text" placeholder="Mehrza-Elahieh" style="direction:ltr"></label>
      <div class="t12 m">کارمند فقط وقتی به این شبکه وصل است می‌تواند ورود و خروج بزند.</div>
    </div>
    <div class="card rise d3 fc g8">
      <b class="t14 w8">منو و انبار</b>
      <div class="kv"><span>کپی منوی شعبه ونک</span><label class="swl"><input class="swi" type="checkbox" checked aria-label="کپی منو"><span class="sw"></span></label></div>
      <div class="kv"><span>انبار مستقل برای این شعبه</span><label class="swl"><input class="swi" type="checkbox" checked aria-label="انبار مستقل"><span class="sw"></span></label></div>
    </div>
    <a href="Branches.html" class="btn tap rise d4" style="flex:none">ثبت شعبه</a>
    <a href="StaffAdd.html" class="btn ghost tap rise d5" style="flex:none">بعد از ثبت، افزودن کارمند</a>
  </div>
  <nav class="dock" aria-label="ناوبری">
    <a href="Main.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg></span>خانه</a>

    <a href="InvKardex.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5L12 12l9-4.5M12 12v9"/></svg></span>انبار</a>

    <a href="Branches.html" class="on"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10l1-5h14l1 5"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg></span>شعبه‌ها</a>
  </nav>
