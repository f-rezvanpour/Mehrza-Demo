<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>اطلاعات حساس</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="./dc-lite.js" defer></script>
<style>html{background:#0b0705}@media(min-width:520px){body{display:flex;justify-content:center;padding:24px 0;min-height:100vh;box-sizing:border-box}x-dc{border-radius:38px;overflow:hidden;box-shadow:0 0 0 8px #1d1510,0 30px 80px rgba(0,0,0,.6);height:844px}}x-dc{display:block}</style>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0}

</style>
</helmet>
<div class="app a-vio" dir="rtl">
  <div class="glow"></div>
  <div class="bar rise">
    <a class="back tap" href="AdminSettings.html" aria-label="بازگشت"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    <div class="f1"><h1 class="ttl">اطلاعات حساس</h1><div class="sub t12 m">نمایش با تایید و ثبت در لاگ</div></div>
  </div>
  <div class="scroll">
    <div class="card hero rise d1"><div class="t13">کد ملی و شماره شبا همیشه پوشیده‌اند. نمایش آن‌ها نیاز به پین دارد و در لاگ ثبت می‌شود.</div></div>
    <sc-for list="{{rows}}" as="e" hint-placeholder-count="3"><div class="card rise d2"><div class="fx ai jb"><b class="t14 w8">{{e.n}}</b><button type="button" class="pill {{e.pc}} tap" style="border:0;font:inherit;cursor:pointer" onClick="{{e.tg}}">{{e.btn}}</button></div><div class="kv"><span class="m">کد ملی</span><b style="direction:ltr">{{e.nid}}</b></div><div class="kv"><span class="m">شبا</span><b style="direction:ltr">{{e.sh}}</b></div></div></sc-for>
    <div class="fx ai jb rise d3"><h2 class="h2">لاگ نمایش</h2></div>
    <sc-for list="{{log}}" as="l" hint-placeholder-count="1"><div class="item"><div class="f1"><b class="t14 w8">{{l}}</b></div></div></sc-for>
    <div class="card rise d4" style="padding:4px 16px"><div class="kv"><b>خروجی گرفتن از اطلاعات هویتی</b><label class="swl"><input class="swi" type="checkbox" aria-label="خروجی"><span class="sw"></span></label></div></div>
  </div>
  <nav class="dock" aria-label="ناوبری">
    <a href="Main.html" class="on"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg></span>خانه</a>
    <a href="AcctHome.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></span>حسابداری</a>
    <a href="InvKardex.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5L12 12l9-4.5M12 12v9"/></svg></span>انبار</a>
    <a href="ProdList.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h13v5a5 5 0 01-5 5H9a5 5 0 01-5-5z"/><path d="M17 9h2a2 2 0 010 4h-2"/></svg></span>محصولات</a>
    <a href="Branches.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10l1-5h14l1 5"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg></span>شعبه‌ها</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { o: [false, false, false], log: ['دیروز، مهدی صادقی شبا و کد ملی رضا را دید'] }; }
  renderVals() {
    const E = [['علی کرمی', '۰۰۱۲۳۴۵۶۷۸', 'IR12 0170 0000 0012 3456 7890 12'], ['سارا نوری', '۰۰۶۵۴۳۲۱۰۹', 'IR34 0560 0000 0098 7654 3210 11'], ['نگار عباسی', '۰۰۸۸۸۷۷۷۶۶', 'IR56 0120 0000 0055 5444 3330 22']];
    const mk = (s) => s.slice(0, 3) + '•••••••' + s.slice(-2);
    return { rows: E.map((e, i) => { const o = this.state.o[i]; return { n: e[0], nid: o ? e[1] : '۰۰•••••••' + e[1].slice(-2), sh: o ? e[2] : 'IR••••••••••••••••' + e[2].slice(-2), btn: o ? 'پوشاندن' : 'نمایش با پین', pc: o ? 'p-warn' : 'p-info',
      tg: () => { const a = this.state.o.slice(); a[i] = !a[i]; const l = a[i] ? ['همین الان، مدیر اطلاعات ' + e[0] + ' را دید'].concat(this.state.log) : this.state.log; this.setState({ o: a, log: l }); } }; }), log: this.state.log };
  }
}
</script>
</body>
</html>
