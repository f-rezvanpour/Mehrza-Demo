<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>سفارش‌های من</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="./dc-lite.js" defer></script>
<style>html{background:#0b0705}@media(min-width:520px){body{display:flex;justify-content:center;padding:24px 0;min-height:100vh;box-sizing:border-box}x-dc{border-radius:38px;overflow:hidden;box-shadow:0 0 0 8px #1d1510,0 30px 80px rgba(0,0,0,.6);height:844px}}x-dc{display:block}</style>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
.cat{flex:none;height:36px;padding:0 15px;border-radius:18px;border:1.5px solid var(--line);background:var(--card);color:var(--mut);font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.cat.on{border-color:var(--ac);color:var(--ac)}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--mut);font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.tabs button.on{border-color:var(--ac);color:var(--ac)}
.stp{display:flex;align-items:center;gap:8px}
.stp button{width:34px;height:34px;border-radius:11px;border:1.5px solid var(--line);background:var(--card2);color:var(--tx);font:inherit;font-size:18px;font-weight:900;cursor:pointer}
.stp b{min-width:28px;text-align:center}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;color:var(--mut);font-weight:700;text-align:right;padding:6px 4px}
.tbl td{padding:9px 4px;border-top:1px solid var(--line)}
.tbl .n{text-align:left;direction:ltr;font-weight:800}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px}
.bars i{flex:1;border-radius:6px 6px 0 0;background:var(--ac);transition:height .4s;min-width:6px}
</style>
</helmet>
<div class="app a-rose" dir="rtl">
  <div class="glow"></div>
  <div class="bar rise">
    <a class="back tap" href="AppProfile.html" aria-label="بازگشت"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    <div class="f1"><h1 class="ttl">سفارش‌های من</h1><div class="sub t12 m">سابقه و علاقه‌مندی‌ها</div></div>
  </div>
  <div class="scroll">
    <div class="tabs rise d1"><button type="button" class="{{c0}}" onClick="{{t0}}">سفارش‌ها</button><button type="button" class="{{c1}}" onClick="{{t1}}">علاقه‌مندی‌ها</button></div>
    <sc-if value="{{v0}}" hint-placeholder-val="{{true}}">
      <a href="AppTrack.html" class="card tap rise d2" style="border-color:#F5A1BB"><div class="fx ai jb"><b class="t14 w8">سفارش ۱۰۴۲</b><span class="pill p-warn">در حال آماده‌سازی</span></div><div class="t12 m">آمریکانو و لاته، ۲۰۹٬۵۵۰ تومان</div></a>
      <sc-for list="{{rows}}" as="o" hint-placeholder-count="2"><div class="card rise d3"><div class="fx ai jb"><b class="t14 w8">سفارش {{o.no}}</b><span class="t12 m">{{o.when}}</span></div><div class="t12 m" style="margin:2px 0 8px">{{o.d}}</div><div class="fx ai jb"><b>{{o.amt}}</b><button type="button" class="btn ghost tap" style="flex:none;height:38px;padding:0 14px;font-size:12.5px;border-radius:12px" onClick="{{o.again}}">{{o.btn}}</button></div></div></sc-for>
    </sc-if>
    <sc-if value="{{v1}}" hint-placeholder-val="{{false}}">
      <div class="item rise d2"><span class="blob" style="background:#F5A1BB">♥</span><div class="f1"><b class="t14 w8">لاته، شیر بادام، ۱ شات اضافه</b><div class="t12 m">۱۶۵٬۰۰۰ تومان</div></div><a href="AppProduct.html" class="pill p-info">سفارش</a></div>
      <div class="item rise d3"><span class="blob" style="background:#F5A1BB">♥</span><div class="f1"><b class="t14 w8">آمریکانو، بزرگ</b><div class="t12 m">۱۲۰٬۰۰۰ تومان</div></div><a href="AppProduct.html" class="pill p-info">سفارش</a></div>
    </sc-if>
  </div>
  <nav class="dock" aria-label="ناوبری">
    <a href="AppHome.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg></span>خانه</a>
    <a href="Game.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="7" width="19" height="11" rx="5"/><path d="M7.5 10.5v4M5.5 12.5h4"/><circle cx="15.5" cy="11.5" r="1"/><circle cx="18" cy="13.5" r="1"/></svg></span>بازی</a>
    <a href="GameRewards.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M12 8v12M3 12h18M12 8c-3 0-4-4-1-4 2 0 1 4 1 4zm0 0c3 0 4-4 1-4-2 0-1 4-1 4z"/></svg></span>جوایز</a>
    <a href="AppClub.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.6 5.6 6 .8-4.4 4.1 1.1 6L12 16.6 6.7 19.5l1.1-6L3.4 9.4l6-.8z"/></svg></span>باشگاه</a>
    <a href="AppProfile.html" class="on"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-6 8-6s8 2 8 6"/></svg></span>من</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { t: 0, a: [false, false] }; }
  renderVals() {
    const O = [['۱۰۲۱', '۳ روز پیش', 'لاته و کروسان', '۱۹۵٬۰۰۰ تومان'], ['۱۰۰۸', 'هفته پیش', 'کاپوچینو', '۱۱۵٬۰۰۰ تومان']];
    const t = this.state.t;
    return { c0: t === 0 ? 'on' : '', c1: t === 1 ? 'on' : '', t0: () => this.setState({ t: 0 }), t1: () => this.setState({ t: 1 }), v0: t === 0, v1: t === 1,
      rows: O.map((o, i) => ({ no: o[0], when: o[1], d: o[2], amt: o[3], btn: this.state.a[i] ? 'به سبد اضافه شد' : 'دوباره سفارش بده', again: () => { const a = this.state.a.slice(); a[i] = true; this.setState({ a }); } })) };
  }
}
</script>
</body>
</html>
