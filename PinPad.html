<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>تایید با پین</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="./dc-lite.js" defer></script>
<style>html{background:#0b0705}@media(min-width:520px){body{display:flex;justify-content:center;padding:24px 0;min-height:100vh;box-sizing:border-box}x-dc{border-radius:38px;overflow:hidden;box-shadow:0 0 0 8px #1d1510,0 30px 80px rgba(0,0,0,.6);height:844px}}x-dc{display:block}</style>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;direction:ltr}
.pad button{height:62px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);color:var(--tx);font:inherit;font-size:22px;font-weight:800;cursor:pointer}
.pad button:active{background:var(--card2)}
.dots{display:flex;gap:14px;justify-content:center;direction:ltr}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line)}
.dots i.f{background:var(--ac);border-color:var(--ac)}
</style>
</helmet>
<div class="app a-gold" dir="rtl">
  <div class="glow"></div>
  <div class="bar rise">
    <a class="back tap" href="CashierPay.html" aria-label="بازگشت"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    <div class="f1"><h1 class="ttl">تایید با پین</h1><div class="sub t12 m">تخفیف ۱۰٪ سفارش ۱۰۴۳</div></div>
  </div>
  <div class="scroll">
    <div class="card hero rise d1 tc"><div class="t14 w8">پین مدیر شعبه را وارد کن</div><div class="dots" style="margin:14px 0"><sc-for list="{{dots}}" as="d" hint-placeholder-count="4"><i class="{{d.c}}"></i></sc-for></div><div class="t13 {{mc}}">{{msg}}</div></div>
    <div class="pad rise d2"><sc-for list="{{keys}}" as="k" hint-placeholder-count="12"><button type="button" onClick="{{k.press}}">{{k.l}}</button></sc-for></div>
    <sc-if value="{{ok}}" hint-placeholder-val="{{false}}"><a href="CashierPay.html" class="btn tap pop" style="flex:none">بازگشت به پرداخت</a></sc-if>
    <div class="t11 m tc">در نمونه، پین درست ۱۲۳۴ است.</div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { p: '', ok: false, bad: false }; }
  renderVals() {
    const s = this.state;
    const press = (k) => () => {
      const c = this.state; if (c.ok) return;
      if (k === '⌫') return this.setState({ p: c.p.slice(0, -1), bad: false });
      if (k === '') return;
      const p = (c.p + k).slice(0, 4);
      if (p.length === 4) this.setState(p === '1234' ? { p, ok: true, bad: false } : { p: '', bad: true }); else this.setState({ p, bad: false });
    };
    const fa = (n) => String(n).replace(/\d/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]);
    return { dots: [0, 1, 2, 3].map((i) => ({ c: i < s.p.length || s.ok ? 'f' : '' })), msg: s.ok ? 'تایید شد' : (s.bad ? 'پین اشتباه است' : 'چهار رقم'), mc: s.ok ? 'sage' : (s.bad ? '' : 'm'), ok: s.ok,
      keys: ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'].map((k) => ({ l: k === '⌫' ? k : (k ? fa(k) : ''), press: press(k) })) };
  }
}
</script>
</body>
</html>
