<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>انبارگردانی</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="./dc-lite.js" defer></script>
<style>html{background:#0b0705}@media(min-width:520px){body{display:flex;justify-content:center;padding:24px 0;min-height:100vh;box-sizing:border-box}x-dc{border-radius:38px;overflow:hidden;box-shadow:0 0 0 8px #1d1510,0 30px 80px rgba(0,0,0,.6);height:844px}}x-dc{display:block}</style>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
.fld{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--mut);font-weight:600}
.fld input,.fld select{height:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--card2);color:var(--tx);padding:0 14px;font:inherit;font-size:15px;outline:0;width:100%;box-sizing:border-box}
.fld input:focus,.fld select:focus{border-color:var(--ac)}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--mut);font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.tabs button.on{border-color:var(--ac);color:var(--ac)}
.stp{display:flex;align-items:center;gap:8px}
.stp button{width:34px;height:34px;border-radius:11px;border:1.5px solid var(--line);background:var(--card2);color:var(--tx);font:inherit;font-size:18px;font-weight:900;cursor:pointer}
.stp b{min-width:28px;text-align:center}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;color:var(--mut);font-weight:700;text-align:right;padding:6px 4px}
.tbl td{padding:9px 4px;border-top:1px solid var(--line)}
.tbl .n{text-align:left;direction:ltr;font-weight:800}

</style>
</helmet>
<div class="app a-gold" dir="rtl">
  <div class="glow"></div>
  <div class="bar rise">
    <a class="back tap" href="InvKardex.html" aria-label="بازگشت"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    <div class="f1"><h1 class="ttl">انبارگردانی</h1><div class="sub t12 m">مقایسه موجودی سیستم با شمارش</div></div>
  </div>
  <div class="scroll">
    <div class="card rise d1" style="padding:4px 16px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="4"><div class="kv"><div><b>{{r.n}}</b><div class="t12 m">سیستم {{r.s}}، اختلاف <span class="{{r.vc}}">{{r.v}}</span></div></div><div class="stp"><button type="button" onClick="{{r.less}}" aria-label="کم">−</button><b>{{r.c}}</b><button type="button" onClick="{{r.more}}" aria-label="زیاد">+</button></div></div></sc-for>
    </div>
    <div class="card rise d2" style="border-color:rgba(240,138,138,.5)">
      <div class="fx ai jb"><b class="t14 w8">ارزش کسری</b><b class="t18 w9" style="color:#F08A8A">{{loss}}</b></div>
      <div class="kv"><span class="m">بدهکار ضایعات و کسری انبار</span><b>{{loss}}</b></div>
      <div class="kv"><span class="m">بستانکار موجودی کالا</span><b>{{loss}}</b></div>
    </div>
    <button type="button" class="btn tap rise d3" style="flex:none" onClick="{{save}}">{{btn}}</button>
  </div>
  <nav class="dock" aria-label="ناوبری">
    <a href="Main.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg></span>خانه</a>
    <a href="AcctHome.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></span>حسابداری</a>
    <a href="InvKardex.html" class="on"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5L12 12l9-4.5M12 12v9"/></svg></span>انبار</a>
    <a href="ProdList.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h13v5a5 5 0 01-5 5H9a5 5 0 01-5-5z"/><path d="M17 9h2a2 2 0 010 4h-2"/></svg></span>محصولات</a>
    <a href="Branches.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10l1-5h14l1 5"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg></span>شعبه‌ها</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { c: [12150, 47200, 636, 700], ok: false }; }
  renderVals() {
    const fa = (n) => String(n).replace(/\d/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]);
    const fmt = (n) => fa(Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '٬'));
    const I = [['دان قهوه (گرم)', 12400, 1200, 50], ['شیر (میلی‌لیتر)', 48000, 60, 100], ['لیوان (عدد)', 640, 3000, 1], ['درب (عدد)', 700, 1500, 1]];
    const c = this.state.c;
    let loss = 0;
    const rows = I.map((x, k) => { const d = c[k] - x[1]; loss += d < 0 ? -d * x[2] : 0; const ch = (s) => () => { const a = this.state.c.slice(); a[k] = Math.max(0, a[k] + s * x[3]); this.setState({ c: a, ok: false }); };
      return { n: x[0], s: fmt(x[1]), c: fmt(c[k]), v: d === 0 ? 'ندارد' : (d < 0 ? '−' : '+') + fmt(Math.abs(d)), vc: d < 0 ? 'w8' : 'sage', less: ch(-1), more: ch(1) }; });
    return { rows, loss: fmt(loss) + ' تومان', save: () => this.setState({ ok: true }), btn: this.state.ok ? 'تعدیل ثبت شد' : 'ثبت تعدیل انبار' };
  }
}
</script>
</body>
</html>
