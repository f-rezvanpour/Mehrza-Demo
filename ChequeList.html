<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>چک‌ها</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="./dc-lite.js" defer></script>
<style>html{background:#0b0705}@media(min-width:520px){body{display:flex;justify-content:center;padding:24px 0;min-height:100vh;box-sizing:border-box}x-dc{border-radius:38px;overflow:hidden;box-shadow:0 0 0 8px #1d1510,0 30px 80px rgba(0,0,0,.6);height:844px}}x-dc{display:block}</style>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
.cat{flex:none;height:36px;padding:0 15px;border-radius:18px;border:1.5px solid var(--line);background:var(--card);color:var(--mut);font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.cat.on{border-color:var(--ac);color:var(--ac)}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--mut);font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.tabs button.on{border-color:var(--ac);color:var(--ac)}
.stp{display:flex;align-items:center;gap:8px}
.stp button{width:34px;height:34px;border-radius:11px;border:1.5px solid var(--line);background:var(--card2);color:var(--tx);font:inherit;font-size:18px;font-weight:900;cursor:pointer}
.stp b{min-width:28px;text-align:center}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;color:var(--mut);font-weight:700;text-align:right;padding:6px 4px}
.tbl td{padding:9px 4px;border-top:1px solid var(--line)}
.tbl .n{text-align:left;direction:ltr;font-weight:800}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px}
.bars i{flex:1;border-radius:6px 6px 0 0;background:var(--ac);transition:height .4s;min-width:6px}
</style>
</helmet>
<div class="app a-sage" dir="rtl">
  <div class="glow"></div>
  <div class="bar rise">
    <a class="back tap" href="AcctHome.html" aria-label="بازگشت"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    <div class="f1"><h1 class="ttl">چک‌ها</h1><div class="sub t12 m">دریافتی و پرداختی</div></div><a href="ChequeAdd.html" class="chip tap" style="border-color:#8FD3A4;color:#8FD3A4">+ چک</a>
  </div>
  <div class="scroll">
    <div class="tabs rise d1"><button type="button" class="{{c0}}" onClick="{{t0}}">دریافتی</button><button type="button" class="{{c1}}" onClick="{{t1}}">پرداختی</button></div>
    <div class="card hero rise d2"><div class="grid2" style="gap:10px"><div><div class="t12 m">در جریان وصول</div><div class="t20 w9">{{open}}</div></div><div><div class="t12 m">سررسید ۷ روز آینده</div><div class="t20 w9 gold">{{soon}}</div></div></div></div>
    <sc-for list="{{rows}}" as="c" hint-placeholder-count="4"><a href="ChequeDetail.html" class="item tap rise d3"><span class="blob" style="background:{{c.col}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h6M7 14h3"/></svg></span><div class="f1"><b class="t14 w8">{{c.who}}</b><div class="t12 m">{{c.bank}}، سررسید {{c.due}}</div></div><div class="tc"><b class="t13">{{c.amt}}</b><div><span class="pill {{c.pc}}">{{c.st}}</span></div></div></a></sc-for>
  </div>
  <nav class="dock" aria-label="ناوبری">
    <a href="Main.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg></span>خانه</a>
    <a href="AcctHome.html" class="on"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></span>حسابداری</a>
    <a href="InvKardex.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5L12 12l9-4.5M12 12v9"/></svg></span>انبار</a>
    <a href="ProdList.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h13v5a5 5 0 01-5 5H9a5 5 0 01-5-5z"/><path d="M17 9h2a2 2 0 010 4h-2"/></svg></span>محصولات</a>
    <a href="Branches.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10l1-5h14l1 5"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg></span>شعبه‌ها</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { t: 0 }; }
  renderVals() {
    const R = [
      [['شرکت رستوران‌دار پارس', 'ملی', '۱۲ آبان', '۴۵٬۰۰۰٬۰۰۰', 'در جریان', 'p-warn', '#E8B25C'], ['کترینگ مهمان‌سرا', 'ملت', '۲۸ مهر', '۱۸٬۰۰۰٬۰۰۰', 'وصول شد', 'p-ok', '#8FD3A4'], ['فروش عمده، دکتر رضایی', 'صادرات', '۲۰ آبان', '۲۲٬۰۰۰٬۰۰۰', 'در جریان', 'p-warn', '#E8B25C']],
      [['کافه‌دان تهران', 'ملت', '۱۰ آبان', '۳۶٬۰۰۰٬۰۰۰', 'در جریان', 'p-warn', '#EE8F66'], ['لبنیات سحر', 'ملی', '۵ آبان', '۱۲٬۰۰۰٬۰۰۰', 'سررسید نزدیک', 'p-bad', '#F08A8A'], ['بسته‌بندی آریا', 'ملت', '۲ مهر', '۱۰٬۰۰۰٬۰۰۰', 'پاس شد', 'p-ok', '#8FD3A4']]
    ];
    const t = this.state.t;
    return { c0: t === 0 ? 'on' : '', c1: t === 1 ? 'on' : '', t0: () => this.setState({ t: 0 }), t1: () => this.setState({ t: 1 }),
      open: t === 0 ? '۶۷٬۰۰۰٬۰۰۰' : '۴۸٬۰۰۰٬۰۰۰', soon: t === 0 ? '۴۵٬۰۰۰٬۰۰۰' : '۱۲٬۰۰۰٬۰۰۰',
      rows: R[t].map((r) => ({ who: r[0], bank: 'بانک ' + r[1], due: r[2], amt: r[3], st: r[4], pc: r[5], col: r[6] })) };
  }
}
</script>
</body>
</html>
