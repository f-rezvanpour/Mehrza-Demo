<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>پرداخت به تامین‌کننده</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="./dc-lite.js" defer></script>
<style>html{background:#0b0705}@media(min-width:520px){body{display:flex;justify-content:center;padding:24px 0;min-height:100vh;box-sizing:border-box}x-dc{border-radius:38px;overflow:hidden;box-shadow:0 0 0 8px #1d1510,0 30px 80px rgba(0,0,0,.6);height:844px}}x-dc{display:block}</style>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
.fld{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--mut);font-weight:600}
.fld input,.fld select{height:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--card2);color:var(--tx);padding:0 14px;font:inherit;font-size:15px;outline:0;width:100%;box-sizing:border-box}
.fld input:focus,.fld select:focus{border-color:var(--ac)}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--mut);font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.tabs button.on{border-color:var(--ac);color:var(--ac)}
.stp{display:flex;align-items:center;gap:8px}
.stp button{width:34px;height:34px;border-radius:11px;border:1.5px solid var(--line);background:var(--card2);color:var(--tx);font:inherit;font-size:18px;font-weight:900;cursor:pointer}
.stp b{min-width:28px;text-align:center}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;color:var(--mut);font-weight:700;text-align:right;padding:6px 4px}
.tbl td{padding:9px 4px;border-top:1px solid var(--line)}
.tbl .n{text-align:left;direction:ltr;font-weight:800}

</style>
</helmet>
<div class="app a-gold" dir="rtl">
  <div class="glow"></div>
  <div class="bar rise">
    <a class="back tap" href="Suppliers.html" aria-label="بازگشت"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    <div class="f1"><h1 class="ttl">کافه‌دان تهران</h1><div class="sub t12 m">فاکتورهای باز و پرداخت</div></div>
  </div>
  <div class="scroll">
    <div class="card hero rise d1 tc"><div class="t12 m">مانده بدهی</div><div class="t36 w9 gold" style="line-height:1.2">{{rem}}</div></div>
    <sc-for list="{{inv}}" as="v" hint-placeholder-count="3"><button type="button" class="item tap" style="width:100%;text-align:right;color:var(--tx);cursor:pointer;border-color:{{v.bc}}" onClick="{{v.pick}}"><span class="blob" style="background:{{v.col}}">{{v.mark}}</span><div class="f1"><b class="t14 w8">فاکتور {{v.no}}</b><div class="t12 m">سررسید {{v.due}}</div></div><b>{{v.amt}}</b></button></sc-for>
    <div class="card rise d3 fc g10"><div class="tabs"><button type="button" class="{{m0}}" onClick="{{s0}}">انتقال بانکی</button><button type="button" class="{{m1}}" onClick="{{s1}}">چک</button></div>
      <div class="t12 m">{{hint}}</div>
      <button type="button" class="btn tap" style="flex:none;opacity:{{op}}" onClick="{{pay}}">{{btn}}</button></div>
  </div>
  <nav class="dock" aria-label="ناوبری">
    <a href="Main.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg></span>خانه</a>
    <a href="AcctHome.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></span>حسابداری</a>
    <a href="InvKardex.html" class="on"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5L12 12l9-4.5M12 12v9"/></svg></span>انبار</a>
    <a href="ProdList.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h13v5a5 5 0 01-5 5H9a5 5 0 01-5-5z"/><path d="M17 9h2a2 2 0 010 4h-2"/></svg></span>محصولات</a>
    <a href="Branches.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10l1-5h14l1 5"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg></span>شعبه‌ها</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: [false, false, false], paid: [false, false, false], m: 0 }; }
  renderVals() {
    const fa = (n) => String(n).replace(/\d/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]);
    const fmt = (n) => fa(Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '٬'));
    const I = [['۵۱۲', '۱۰ آبان', 36000000], ['۴۹۸', '۲۸ مهر', 32000000], ['۴۷۷', '۱۵ مهر', 30000000]];
    const s = this.state;
    let rem = 0, pick = 0;
    I.forEach((x, i) => { if (!s.paid[i]) rem += x[2]; if (s.sel[i] && !s.paid[i]) pick += x[2]; });
    return {
      rem: fmt(rem) + ' تومان',
      inv: I.map((x, i) => ({ no: x[0], due: x[1], amt: fmt(x[2]), col: s.paid[i] ? '#8FD3A4' : (s.sel[i] ? '#E8B25C' : 'var(--card2)'), mark: s.paid[i] ? '✓' : (s.sel[i] ? '●' : ''), bc: s.sel[i] && !s.paid[i] ? '#E8B25C' : 'var(--line)', pick: () => { if (this.state.paid[i]) return; const a = this.state.sel.slice(); a[i] = !a[i]; this.setState({ sel: a }); } })),
      m0: s.m === 0 ? 'on' : '', m1: s.m === 1 ? 'on' : '', s0: () => this.setState({ m: 0 }), s1: () => this.setState({ m: 1 }),
      hint: s.m === 0 ? 'سند: بدهکار پرداختنی، بستانکار بانک ملت' : 'سند: بدهکار پرداختنی، بستانکار اسناد پرداختنی و ثبت در لیست چک‌ها',
      btn: pick ? 'پرداخت ' + fmt(pick) + ' تومان' : 'فاکتورها را انتخاب کن', op: pick ? '1' : '.5',
      pay: () => { const c = this.state; if (!c.sel.some((v, i) => v && !c.paid[i])) return; this.setState({ paid: c.paid.map((p, i) => p || c.sel[i]), sel: [false, false, false] }); }
    };
  }
}
</script>
</body>
</html>
