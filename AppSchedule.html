<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>زمان تحویل</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="./dc-lite.js" defer></script>
<style>html{background:#0b0705}@media(min-width:520px){body{display:flex;justify-content:center;padding:24px 0;min-height:100vh;box-sizing:border-box}x-dc{border-radius:38px;overflow:hidden;box-shadow:0 0 0 8px #1d1510,0 30px 80px rgba(0,0,0,.6);height:844px}}x-dc{display:block}</style>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
.fld{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--mut);font-weight:600}
.fld input,.fld select{height:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--card2);color:var(--tx);padding:0 14px;font:inherit;font-size:15px;outline:0;width:100%;box-sizing:border-box}
.fld input:focus,.fld select:focus{border-color:var(--ac)}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--mut);font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.tabs button.on{border-color:var(--ac);color:var(--ac)}
.stp{display:flex;align-items:center;gap:8px}
.stp button{width:34px;height:34px;border-radius:11px;border:1.5px solid var(--line);background:var(--card2);color:var(--tx);font:inherit;font-size:18px;font-weight:900;cursor:pointer}
.stp b{min-width:28px;text-align:center}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;color:var(--mut);font-weight:700;text-align:right;padding:6px 4px}
.tbl td{padding:9px 4px;border-top:1px solid var(--line)}
.tbl .n{text-align:left;direction:ltr;font-weight:800}
.opt{flex:none;height:44px;padding:0 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--mut);font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.opt.on{border-color:var(--ac);color:var(--ac)}
</style>
</helmet>
<div class="app a-sage" dir="rtl">
  <div class="glow"></div>
  <div class="bar rise">
    <a class="back tap" href="AppCart.html" aria-label="بازگشت"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    <div class="f1"><h1 class="ttl">زمان تحویل</h1><div class="sub t12 m">سفارش برای وقتی که می‌رسی</div></div>
  </div>
  <div class="scroll">
    <div class="card rise d1 fc g10"><b class="t14 w8">چه موقع می‌رسی؟</b><div class="fx g8" style="flex-wrap:wrap"><sc-for list="{{slots}}" as="o" hint-placeholder-count="6"><button type="button" class="opt tap {{o.cls}}" onClick="{{o.pick}}">{{o.n}}</button></sc-for></div></div>
    <div class="card rise d2" style="border-color:rgba(143,211,164,.5)"><div class="t13">{{note}}</div></div>
    <div class="item rise d3"><span class="blob"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10l1-5h14l1 5"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg></span><div class="f1"><b class="t14 w8">مهرزا ونک</b><div class="t12 m">حدود ۲ دقیقه با تو فاصله دارد</div></div></div>
    <a href="AppTrack.html" class="btn tap rise d4" style="flex:none">ثبت سفارش برای {{pick}}</a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { s: 0 }; }
  renderVals() {
    const S = ['همین الان', '۱۰ دقیقه دیگر', '۲۰ دقیقه دیگر', '۳۰ دقیقه دیگر', '۱ ساعت دیگر', '۱۸:۰۰'];
    const s = this.state.s;
    return { slots: S.map((n, i) => ({ n, cls: i === s ? 'on' : '', pick: () => this.setState({ s: i }) })), pick: S[s], note: s === 0 ? 'باریستا همین حالا شروع می‌کند.' : 'آماده‌سازی دقیقا ' + S[s] + ' شروع می‌شود تا نوشیدنی داغ به دستت برسد.' };
  }
}
</script>
</body>
</html>
