<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>تاریخ انقضا</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="./dc-lite.js" defer></script>
<style>html{background:#0b0705}@media(min-width:520px){body{display:flex;justify-content:center;padding:24px 0;min-height:100vh;box-sizing:border-box}x-dc{border-radius:38px;overflow:hidden;box-shadow:0 0 0 8px #1d1510,0 30px 80px rgba(0,0,0,.6);height:844px}}x-dc{display:block}</style>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0}

</style>
</helmet>
<div class="app a-gold" dir="rtl">
  <div class="glow"></div>
  <div class="bar rise">
    <a class="back tap" href="InvKardex.html" aria-label="بازگشت"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    <div class="f1"><h1 class="ttl">تاریخ انقضا</h1><div class="sub t12 m">اول انقضا، اول مصرف (FEFO)</div></div>
  </div>
  <div class="scroll">
    <sc-for list="{{rows}}" as="b" hint-placeholder-count="5"><div class="card rise d2"><div class="fx ai jb"><div><b class="t14 w8">{{b.n}}</b><div class="t12 m">{{b.batch}}، {{b.qty}}</div></div><span class="pill {{b.pc}}">{{b.left}}</span></div>
      <button type="button" class="btn ghost tap" style="flex:none;height:38px;font-size:12.5px;margin-top:8px;border-radius:12px" onClick="{{b.toss}}">{{b.btn}}</button></div></sc-for>
    <div class="t12 m tc">دورریز، ضایعات را با ارزش به‌روز در سند حسابداری ثبت می‌کند.</div>
  </div>
  <nav class="dock" aria-label="ناوبری">
    <a href="Main.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg></span>خانه</a>
    <a href="AcctHome.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></span>حسابداری</a>
    <a href="InvKardex.html" class="on"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5L12 12l9-4.5M12 12v9"/></svg></span>انبار</a>
    <a href="ProdList.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h13v5a5 5 0 01-5 5H9a5 5 0 01-5-5z"/><path d="M17 9h2a2 2 0 010 4h-2"/></svg></span>محصولات</a>
    <a href="Branches.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10l1-5h14l1 5"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg></span>شعبه‌ها</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { t: [false, false, false, false, false] }; }
  renderVals() {
    const B = [['کروسان', 'دسته ۴۱', '۱۲ عدد', 'امروز', 'p-bad'], ['چیزکیک', 'دسته ۳۸', '۶ برش', '۲ روز', 'p-bad'], ['شیر', 'دسته ۱۷۷', '۴۰ لیتر', '۳ روز', 'p-warn'], ['کیک هویج', 'دسته ۳۵', '۸ برش', '۴ روز', 'p-warn'], ['دان کلمبیا', 'دسته ۹۰', '۱۲ کیلو', '۱۱۰ روز', 'p-ok']];
    return { rows: B.map((b, i) => { const t = this.state.t[i]; return { n: b[0], batch: b[1], qty: b[2], left: t ? 'دورریز شد' : b[3], pc: t ? 'p-info' : b[4], btn: t ? 'در ضایعات ثبت شد' : 'ثبت دورریز', toss: () => { const a = this.state.t.slice(); a[i] = true; this.setState({ t: a }); } }; }) };
  }
}
</script>
</body>
</html>
