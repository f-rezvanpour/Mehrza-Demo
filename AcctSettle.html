<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>تطبیق کارت‌خوان</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="./dc-lite.js" defer></script>
<style>html{background:#0b0705}@media(min-width:520px){body{display:flex;justify-content:center;padding:24px 0;min-height:100vh;box-sizing:border-box}x-dc{border-radius:38px;overflow:hidden;box-shadow:0 0 0 8px #1d1510,0 30px 80px rgba(0,0,0,.6);height:844px}}x-dc{display:block}</style>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0}

</style>
</helmet>
<div class="app a-sage" dir="rtl">
  <div class="glow"></div>
  <div class="bar rise">
    <a class="back tap" href="AcctHome.html" aria-label="بازگشت"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    <div class="f1"><h1 class="ttl">تطبیق کارت‌خوان با بانک</h1><div class="sub t12 m">واریزی روزانه، کارمزد ۰٫۷٪</div></div>
  </div>
  <div class="scroll">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="3"><div class="card rise d2" style="border-color:{{r.bc}}"><div class="fx ai jb"><b class="t14 w8">{{r.d}}</b><span class="pill {{r.pc}}">{{r.st}}</span></div>
      <div class="kv"><span class="m">فروش کارت‌خوان</span><b>{{r.s}}</b></div><div class="kv"><span class="m">انتظار واریز (پس از کارمزد)</span><b>{{r.e}}</b></div><div class="kv"><span class="m">واریز بانک</span><b>{{r.b}}</b></div>
      <sc-if value="{{r.diff}}" hint-placeholder-val="{{false}}"><button type="button" class="btn tap" style="flex:none;height:40px;font-size:13px;margin-top:8px;border-radius:12px" onClick="{{r.fix}}">ثبت اختلاف و تطبیق</button></sc-if></div></sc-for>
    <div class="t12 m tc">اختلاف به‌صورت «هزینه کارمزد و اختلاف بانکی» سند می‌خورد و روزهای بدون واریز یادآوری می‌شوند.</div>
  </div>
  <nav class="dock" aria-label="ناوبری">
    <a href="Main.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg></span>خانه</a>
    <a href="AcctHome.html" class="on"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></span>حسابداری</a>
    <a href="InvKardex.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5L12 12l9-4.5M12 12v9"/></svg></span>انبار</a>
    <a href="ProdList.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h13v5a5 5 0 01-5 5H9a5 5 0 01-5-5z"/><path d="M17 9h2a2 2 0 010 4h-2"/></svg></span>محصولات</a>
    <a href="Branches.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10l1-5h14l1 5"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg></span>شعبه‌ها</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { f: false }; }
  renderVals() {
    const fa = (n) => String(n).replace(/\d/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]);
    const fmt = (n) => fa(Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '٬'));
    const D = [['۳ آبان', 18450000, 18320850], ['۴ آبان', 19800000, 19561400], ['۵ آبان', 21200000, null]];
    return { rows: D.map((x, i) => { const e = Math.round(x[1] * 0.993), diff = x[2] !== null && x[2] !== e && !(i === 1 && this.state.f);
      return { d: x[0], s: fmt(x[1]), e: fmt(e), b: x[2] === null ? 'هنوز واریز نشده' : fmt(x[2]), diff, st: x[2] === null ? 'منتظر واریز' : (diff ? 'اختلاف ' + fmt(e - x[2]) : 'تطبیق شد'), pc: x[2] === null ? 'p-info' : (diff ? 'p-bad' : 'p-ok'), bc: diff ? '#F08A8A' : 'var(--line)', fix: () => this.setState({ f: true }) }; }) };
  }
}
</script>
</body>
</html>
