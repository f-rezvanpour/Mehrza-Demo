<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>قیمت مواد اولیه</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="./dc-lite.js" defer></script>
<style>html{background:#0b0705}@media(min-width:520px){body{display:flex;justify-content:center;padding:24px 0;min-height:100vh;box-sizing:border-box}x-dc{border-radius:38px;overflow:hidden;box-shadow:0 0 0 8px #1d1510,0 30px 80px rgba(0,0,0,.6);height:844px}}x-dc{display:block}</style>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
.fld{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--mut);font-weight:600}
.fld input,.fld select{height:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--card2);color:var(--tx);padding:0 14px;font:inherit;font-size:15px;outline:0;width:100%;box-sizing:border-box}
.fld input:focus,.fld select:focus{border-color:var(--ac)}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--mut);font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.tabs button.on{border-color:var(--ac);color:var(--ac)}
.stp{display:flex;align-items:center;gap:8px}
.stp button{width:34px;height:34px;border-radius:11px;border:1.5px solid var(--line);background:var(--card2);color:var(--tx);font:inherit;font-size:18px;font-weight:900;cursor:pointer}
.stp b{min-width:28px;text-align:center}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;color:var(--mut);font-weight:700;text-align:right;padding:6px 4px}
.tbl td{padding:9px 4px;border-top:1px solid var(--line)}
.tbl .n{text-align:left;direction:ltr;font-weight:800}

</style>
</helmet>
<div class="app a-gold" dir="rtl">
  <div class="glow"></div>
  <div class="bar rise">
    <a class="back tap" href="AdminMore.html" aria-label="بازگشت"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    <div class="f1"><h1 class="ttl">قیمت مواد اولیه</h1><div class="sub t12 m">با تغییر قیمت، بهای تمام‌شده همه محصولات به‌روز می‌شود</div></div>
  </div>
  <div class="scroll">
    <div class="card hero rise d1"><div class="fx ai jb"><div><b class="t15 w8">دان قهوه، هر گرم</b><div class="t12 m">قیمت فعلی ۱٬۲۰۰</div></div><div class="stp"><button type="button" onClick="{{less}}" aria-label="کم">−</button><b style="min-width:70px">{{p}}</b><button type="button" onClick="{{more}}" aria-label="زیاد">+</button></div></div>
      <svg viewBox="0 0 200 40" width="100%" height="40" aria-hidden="true" style="margin-top:8px"><path d="M0 30L40 28L80 26L120 24L160 18L200 {{y}}" fill="none" stroke="#E8B25C" stroke-width="3" stroke-linecap="round"/></svg><div class="t12 m">آخرین ۶ ماه و قیمت جدید</div></div>
    <sc-if value="{{warn}}" hint-placeholder-val="{{false}}"><div class="card rise d2" style="border-color:#F08A8A"><div class="t13">حاشیه سود {{n}} محصول زیر آستانه ۶۵٪ رفت. قیمت فروش را بازبینی کن.</div></div></sc-if>
    <div class="card rise d3" style="padding:6px 14px"><table class="tbl"><thead><tr><th>محصول</th><th class="n">بهای مواد</th><th class="n">حاشیه</th></tr></thead><tbody>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="5"><tr><td>{{r.n}}</td><td class="n">{{r.c}}</td><td class="n" style="color:{{r.col}}">{{r.m}}</td></tr></sc-for></tbody></table></div>
    <button type="button" class="btn tap rise d4" style="flex:none" onClick="{{save}}">{{btn}}</button>
  </div>
  <nav class="dock" aria-label="ناوبری">
    <a href="Main.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg></span>خانه</a>
    <a href="AcctHome.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></span>حسابداری</a>
    <a href="InvKardex.html" class="on"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5L12 12l9-4.5M12 12v9"/></svg></span>انبار</a>
    <a href="ProdList.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h13v5a5 5 0 01-5 5H9a5 5 0 01-5-5z"/><path d="M17 9h2a2 2 0 010 4h-2"/></svg></span>محصولات</a>
    <a href="Branches.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10l1-5h14l1 5"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg></span>شعبه‌ها</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { p: 1200, ok: false }; }
  renderVals() {
    const fa = (n) => String(n).replace(/\d/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]);
    const fmt = (n) => fa(Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '٬'));
    const P = [['آمریکانو', 95000, 18, 4600], ['لاته', 120000, 18, 16500], ['کاپوچینو', 115000, 18, 11700], ['اسپرسو', 70000, 18, 2000], ['وی‌شصت', 130000, 20, 6000]];
    const p = this.state.p;
    const rows = P.map((x) => { const cost = x[2] * p + x[3], m = (x[1] - cost) / x[1]; return { n: x[0], c: fmt(cost), m: fa(Math.round(m * 1000) / 10).replace('.', '٫') + '٪', col: m < 0.65 ? '#F08A8A' : '#8FD3A4', low: m < 0.65 }; });
    const n = rows.filter((r) => r.low).length;
    return { p: fmt(p), rows, warn: n > 0, n: fa(n), y: String(Math.max(2, Math.min(38, 18 - (p - 1200) / 20))),
      less: () => this.setState({ p: Math.max(800, this.state.p - 50), ok: false }), more: () => this.setState({ p: this.state.p + 50, ok: false }),
      save: () => this.setState({ ok: true }), btn: this.state.ok ? 'قیمت جدید اعمال شد' : 'اعمال قیمت جدید' };
  }
}
</script>
</body>
</html>
