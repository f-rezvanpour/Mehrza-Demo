<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>فروش ساعتی</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="./dc-lite.js" defer></script>
<style>html{background:#0b0705}@media(min-width:520px){body{display:flex;justify-content:center;padding:24px 0;min-height:100vh;box-sizing:border-box}x-dc{border-radius:38px;overflow:hidden;box-shadow:0 0 0 8px #1d1510,0 30px 80px rgba(0,0,0,.6);height:844px}}x-dc{display:block}</style>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
.cat{flex:none;height:36px;padding:0 15px;border-radius:18px;border:1.5px solid var(--line);background:var(--card);color:var(--mut);font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.cat.on{border-color:var(--ac);color:var(--ac)}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--mut);font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.tabs button.on{border-color:var(--ac);color:var(--ac)}
.stp{display:flex;align-items:center;gap:8px}
.stp button{width:34px;height:34px;border-radius:11px;border:1.5px solid var(--line);background:var(--card2);color:var(--tx);font:inherit;font-size:18px;font-weight:900;cursor:pointer}
.stp b{min-width:28px;text-align:center}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;color:var(--mut);font-weight:700;text-align:right;padding:6px 4px}
.tbl td{padding:9px 4px;border-top:1px solid var(--line)}
.tbl .n{text-align:left;direction:ltr;font-weight:800}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px}
.bars i{flex:1;border-radius:6px 6px 0 0;background:var(--ac);transition:height .4s;min-width:6px}.a-gold{}
</style>
</helmet>
<div class="app a-gold" dir="rtl">
  <div class="glow"></div>
  <div class="bar rise">
    <a class="back tap" href="AdminMore.html" aria-label="بازگشت"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    <div class="f1"><h1 class="ttl">فروش ساعتی</h1><div class="sub t12 m">تعداد سفارش در هر ساعت</div></div>
  </div>
  <div class="scroll">
    <div class="tabs rise d1"><button type="button" class="{{c0}}" onClick="{{t0}}">همه</button><button type="button" class="{{c1}}" onClick="{{t1}}">ونک</button><button type="button" class="{{c2}}" onClick="{{t2}}">سعادت‌آباد</button></div>
    <div class="card hero rise d2"><div class="bars" style="color:var(--ac)"><sc-for list="{{bars}}" as="b" hint-placeholder-count="12"><i style="height:{{b.h}}%;background:{{b.col}}"></i></sc-for></div><div class="fx jb t11 m" style="margin-top:4px"><span>۸</span><span>۱۰</span><span>۱۲</span><span>۱۴</span><span>۱۶</span><span>۱۸</span><span>۲۰</span><span>۲۲</span></div></div>
    <div class="grid2 rise d3"><div class="card" style="padding:12px"><div class="t12 m">اوج فروش</div><div class="t18 w9 gold">{{peak}}</div></div><div class="card" style="padding:12px"><div class="t12 m">کم‌فروش‌ترین</div><div class="t18 w9">{{low}}</div></div></div>
    <div class="card rise d4" style="border-color:rgba(143,211,164,.5)"><div class="t13">{{tip}}</div></div>
  </div>
  <nav class="dock" aria-label="ناوبری">
    <a href="Main.html" class="on"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg></span>خانه</a>
    <a href="AcctHome.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></span>حسابداری</a>
    <a href="InvKardex.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5L12 12l9-4.5M12 12v9"/></svg></span>انبار</a>
    <a href="ProdList.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h13v5a5 5 0 01-5 5H9a5 5 0 01-5-5z"/><path d="M17 9h2a2 2 0 010 4h-2"/></svg></span>محصولات</a>
    <a href="Branches.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10l1-5h14l1 5"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg></span>شعبه‌ها</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { b: 0 }; }
  renderVals() {
    const fa = (n) => String(n).replace(/\d/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]);
    const H = [[12, 38, 40, 22, 25, 36, 40, 33, 20, 16, 10, 5, 3, 2, 1, 1], [22, 25, 24, 20, 22, 30, 28, 26, 22, 20, 16, 12, 8, 4, 2, 1]];
    const base = [26, 29, 28, 24, 26, 30, 34, 36, 30, 26, 18, 10, 6, 3, 2, 1];
    const D = this.state.b === 0 ? base.map((v, i) => v * 1.0) : (this.state.b === 1 ? base.map((v) => Math.round(v * 0.58)) : base.map((v) => Math.round(v * 0.42)));
    const mx = Math.max.apply(null, D), mn = Math.min.apply(null, D.slice(0, 12));
    const hi = D.indexOf(mx), lo = D.slice(0, 12).indexOf(mn);
    return {
      c0: this.state.b === 0 ? 'on' : '', c1: this.state.b === 1 ? 'on' : '', c2: this.state.b === 2 ? 'on' : '', t0: () => this.setState({ b: 0 }), t1: () => this.setState({ b: 1 }), t2: () => this.setState({ b: 2 }),
      bars: D.map((v, i) => ({ h: String(Math.round(v / mx * 100)), col: i === hi ? '#E8B25C' : (i === lo ? '#8CCBE0' : 'var(--ac)') })),
      peak: fa(8 + hi) + ' تا ' + fa(9 + hi), low: fa(8 + lo) + ' تا ' + fa(9 + lo),
      tip: 'در ساعت اوج یک نفر اضافه در بار بگذار و ساعت کم‌فروش را برای آموزش و تمیزکاری یا تخفیف استفاده کن.'
    };
  }
}
</script>
</body>
</html>
