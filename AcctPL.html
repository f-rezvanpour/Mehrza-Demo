<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>سود و زیان</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="./dc-lite.js" defer></script>
<style>html{background:#0b0705}@media(min-width:520px){body{display:flex;justify-content:center;padding:24px 0;min-height:100vh;box-sizing:border-box}x-dc{border-radius:38px;overflow:hidden;box-shadow:0 0 0 8px #1d1510,0 30px 80px rgba(0,0,0,.6);height:844px}}x-dc{display:block}</style>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
.fld{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--mut);font-weight:600}
.fld input,.fld select{height:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--card2);color:var(--tx);padding:0 14px;font:inherit;font-size:15px;outline:0;width:100%;box-sizing:border-box}
.fld input:focus,.fld select:focus{border-color:var(--ac)}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--mut);font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.tabs button.on{border-color:var(--ac);color:var(--ac)}
.stp{display:flex;align-items:center;gap:8px}
.stp button{width:34px;height:34px;border-radius:11px;border:1.5px solid var(--line);background:var(--card2);color:var(--tx);font:inherit;font-size:18px;font-weight:900;cursor:pointer}
.stp b{min-width:28px;text-align:center}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;color:var(--mut);font-weight:700;text-align:right;padding:6px 4px}
.tbl td{padding:9px 4px;border-top:1px solid var(--line)}
.tbl .n{text-align:left;direction:ltr;font-weight:800}

</style>
</helmet>
<div class="app a-sage" dir="rtl">
  <div class="glow"></div>
  <div class="bar rise">
    <a class="back tap" href="AcctHome.html" aria-label="بازگشت"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    <div class="f1"><h1 class="ttl">سود و زیان آزمایشی</h1><div class="sub t12 m">مهر ۱۴۰۵، میلیون تومان</div></div>
  </div>
  <div class="scroll">
    <div class="tabs rise d1"><button type="button" class="{{c0}}" onClick="{{t0}}">همه</button><button type="button" class="{{c1}}" onClick="{{t1}}">ونک</button><button type="button" class="{{c2}}" onClick="{{t2}}">سعادت‌آباد</button></div>
    <div class="card hero rise d2 tc"><div class="t12 m">سود خالص آزمایشی</div><div class="t36 w9 gold" style="line-height:1.2">{{net}}</div><div class="t12 m">حاشیه سود خالص {{nm}}</div></div>
    <div class="card rise d3" style="padding:4px 16px">
      <div class="kv"><b>فروش</b><b>{{rev}}</b></div>
      <div class="kv"><span class="m">بهای تمام‌شده کالای فروش‌رفته</span><b style="color:#F08A8A">−{{cogs}}</b></div>
      <div class="kv"><b class="sage">سود ناخالص</b><b class="sage">{{gp}} ({{gm}})</b></div>
    </div>
    <div class="fx ai jb rise d4"><h2 class="h2">هزینه‌های عملیاتی</h2><b class="t13">{{opx}}</b></div>
    <div class="card rise d5" style="padding:4px 16px">
      <sc-for list="{{ex}}" as="e" hint-placeholder-count="9"><div class="kv"><span>{{e.n}}</span><b>{{e.v}}</b></div></sc-for>
    </div>
  </div>
  <nav class="dock" aria-label="ناوبری">
    <a href="Main.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg></span>خانه</a>
    <a href="AcctHome.html" class="on"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></span>حسابداری</a>
    <a href="InvKardex.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5L12 12l9-4.5M12 12v9"/></svg></span>انبار</a>
    <a href="ProdList.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h13v5a5 5 0 01-5 5H9a5 5 0 01-5-5z"/><path d="M17 9h2a2 2 0 010 4h-2"/></svg></span>محصولات</a>
    <a href="Branches.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10l1-5h14l1 5"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg></span>شعبه‌ها</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { b: 0 }; }
  renderVals() {
    const fa = (n) => String(n).replace(/\d/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]);
    const fmt = (n) => fa(Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '٬'));
    const fm = (n) => { const s = (Math.round(n * 10) / 10).toString().split('.'); s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, '٬'); return fa(s.join('٫')); };
    const rev = [1860, 1080, 780], cogs = [612, 355, 257];
    const EX = [['حقوق و دستمزد', 420, 250, 170], ['اجاره', 240, 140, 100], ['بازاریابی', 60, 35, 25], ['برق', 38, 22, 16], ['استهلاک', 28, 16, 12], ['تعمیرات', 22, 12, 10], ['گاز', 16.5, 9.5, 7], ['سایر', 14, 8, 6], ['آب', 9.5, 5.5, 4], ['اینترنت و تلفن', 6, 3, 3]];
    const b = this.state.b;
    const opx = EX.reduce((a, e) => a + e[1 + b], 0);
    const gp = rev[b] - cogs[b];
    const net = gp - opx;
    const set = (n) => () => this.setState({ b: n });
    return {
      c0: b === 0 ? 'on' : '', c1: b === 1 ? 'on' : '', c2: b === 2 ? 'on' : '', t0: set(0), t1: set(1), t2: set(2),
      rev: fm(rev[b]), cogs: fm(cogs[b]), gp: fm(gp), gm: fa(Math.round(gp / rev[b] * 1000) / 10).replace('.', '٫') + '٪',
      opx: fm(opx), net: fm(net), nm: fa(Math.round(net / rev[b] * 1000) / 10).replace('.', '٫') + '٪',
      ex: EX.map((e) => ({ n: e[0], v: fm(e[1 + b]) }))
    };
  }
}
</script>
</body>
</html>
