<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>صندوق</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="./dc-lite.js" defer></script>
<style>html{background:#0b0705}@media(min-width:520px){body{display:flex;justify-content:center;padding:24px 0;min-height:100vh;box-sizing:border-box}x-dc{border-radius:38px;overflow:hidden;box-shadow:0 0 0 8px #1d1510,0 30px 80px rgba(0,0,0,.6);height:844px}}x-dc{display:block}</style>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
.fld{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--mut);font-weight:600}
.fld input,.fld select{height:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--card2);color:var(--tx);padding:0 14px;font:inherit;font-size:15px;outline:0;width:100%;box-sizing:border-box}
.fld input:focus,.fld select:focus{border-color:var(--ac)}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--mut);font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.tabs button.on{border-color:var(--ac);color:var(--ac)}
.stp{display:flex;align-items:center;gap:8px}
.stp button{width:34px;height:34px;border-radius:11px;border:1.5px solid var(--line);background:var(--card2);color:var(--tx);font:inherit;font-size:18px;font-weight:900;cursor:pointer}
.stp b{min-width:28px;text-align:center}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;color:var(--mut);font-weight:700;text-align:right;padding:6px 4px}
.tbl td{padding:9px 4px;border-top:1px solid var(--line)}
.tbl .n{text-align:left;direction:ltr;font-weight:800}
.cat{flex:none;height:36px;padding:0 15px;border-radius:18px;border:1.5px solid var(--line);background:var(--card);color:var(--mut);font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.cat.on{border-color:var(--ac);color:var(--ac)}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--mut);font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.tabs button.on{border-color:var(--ac);color:var(--ac)}
.stp{display:flex;align-items:center;gap:8px}
.stp button{width:34px;height:34px;border-radius:11px;border:1.5px solid var(--line);background:var(--card2);color:var(--tx);font:inherit;font-size:18px;font-weight:900;cursor:pointer}
.stp b{min-width:28px;text-align:center}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;color:var(--mut);font-weight:700;text-align:right;padding:6px 4px}
.tbl td{padding:9px 4px;border-top:1px solid var(--line)}
.tbl .n{text-align:left;direction:ltr;font-weight:800}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px}
.bars i{flex:1;border-radius:6px 6px 0 0;background:var(--ac);transition:height .4s;min-width:6px}.pbtn{display:flex;flex-direction:column;gap:2px;text-align:right;padding:12px;border-radius:18px;border:1.5px solid var(--line);background:var(--card);color:var(--tx);font:inherit;cursor:pointer;position:relative}
.pbtn:active{transform:scale(.97)}
.pbtn .q{position:absolute;top:8px;inset-inline-start:8px;min-width:24px;height:24px;border-radius:12px;background:var(--ac);color:#1B120D;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div class="app a-gold" dir="rtl">
  <div class="glow"></div>
  <div class="bar rise">
    <a class="back tap" href="StaffHome.html" aria-label="بازگشت"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    <div class="f1"><h1 class="ttl">صندوق</h1><div class="sub t12 m">شعبه ونک، صندوق‌دار: نگار عباسی</div></div><span class="pill p-ok">شیفت باز</span>
  </div>
  <div class="scroll">
    <div class="fx g8 rise d1" style="overflow-x:auto"><sc-for list="{{cats}}" as="c" hint-placeholder-count="4"><button type="button" class="cat tap {{c.cls}}" onClick="{{c.pick}}">{{c.n}}</button></sc-for></div>
    <div class="grid2 rise d2">
      <sc-for list="{{items}}" as="p" hint-placeholder-count="6"><button type="button" class="pbtn tap" onClick="{{p.add}}"><sc-if value="{{p.has}}" hint-placeholder-val="{{false}}"><span class="q">{{p.q}}</span></sc-if><b class="t14 w8" style="margin-top:4px">{{p.n}}</b><span class="t12 acc">{{p.price}}</span></button></sc-for>
    </div>
    <div class="card rise d3" style="padding:6px 16px">
      <sc-for list="{{cart}}" as="c" hint-placeholder-count="2"><div class="kv"><div><b>{{c.n}}</b><div class="t12 m">{{c.q}} × {{c.price}}</div></div><button type="button" class="tap" style="background:none;border:0;color:#F08A8A;font:inherit;font-weight:800" onClick="{{c.rm}}" aria-label="حذف">حذف</button></div></sc-for>
      <sc-if value="{{empty}}" hint-placeholder-val="{{false}}"><div class="t13 m tc" style="padding:12px">محصولی انتخاب نشده</div></sc-if>
    </div>
    <div class="card rise d3 fc g8"><div class="fx ai jb"><b class="t13">شماره میز</b><div class="stp"><button type="button" onClick="{{tless}}" aria-label="کم">−</button><b>{{tbl}}</b><button type="button" onClick="{{tmore}}" aria-label="زیاد">+</button></div></div><label class="fld"><span>یادداشت روی سفارش</span><input type="text" placeholder="مثلا: بدون شکر"></label></div>
    <div class="grid3" style="gap:8px"><a href="CashierScan.html" class="btn ghost tap" style="height:42px;font-size:12.5px;border-radius:12px">اسکن مشتری</a><a href="CashierHold.html" class="btn ghost tap" style="height:42px;font-size:12.5px;border-radius:12px">نگه‌دار</a><a href="CashierSplit.html" class="btn ghost tap" style="height:42px;font-size:12.5px;border-radius:12px">تقسیم</a></div>
    <div class="fx ai jb"><b class="t15">جمع</b><b class="t20 w9 gold">{{total}}</b></div>
    <div class="fx g10"><button type="button" class="btn ghost tap" onClick="{{clear}}">خالی کن</button><a href="CashierPay.html" class="btn tap">پرداخت</a></div>
  </div>
  <nav class="dock" aria-label="ناوبری">
    <a href="CashierPOS.html" class="on"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10l1-5h14l1 5"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg></span>صندوق</a>
    <a href="CashierOrders.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 9h6M9 13h6M9 17h3"/></svg></span>سفارش‌ها</a>
    <a href="CashClose.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></span>بستن صندوق</a>
    <a href="StaffHome.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-6 8-6s8 2 8 6"/></svg></span>کارمند</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { q: { ame: 2, cak: 1 }, cat: 'همه', tb: 0 }; }
  renderVals() {
    const fa = (n) => String(n).replace(/\d/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]);
    const fmt = (n) => fa(Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '٬'));
    const P = [['ame', 'آمریکانو', 'قهوه', 95000], ['lat', 'لاته', 'قهوه', 120000], ['cap', 'کاپوچینو', 'قهوه', 115000], ['esp', 'اسپرسو', 'قهوه', 70000], ['v60', 'وی‌شصت', 'دمی', 130000], ['cak', 'چیزکیک', 'شیرینی', 135000], ['cro', 'کروسان', 'شیرینی', 80000], ['hot', 'شکلات داغ', 'نوشیدنی', 110000]];
    const q = this.state.q, sel = this.state.cat;
    const add = (id) => () => { const n = Object.assign({}, this.state.q); n[id] = (n[id] || 0) + 1; this.setState({ q: n }); };
    const rm = (id) => () => { const n = Object.assign({}, this.state.q); delete n[id]; this.setState({ q: n }); };
    const cats = ['همه', 'قهوه', 'دمی', 'نوشیدنی', 'شیرینی'];
    let total = 0;
    const cart = [];
    P.forEach((p) => { const n = q[p[0]] || 0; if (n) { total += n * p[3]; cart.push({ n: p[1], q: fa(n), price: fmt(p[3]), rm: rm(p[0]) }); } });
    return {
      cats: cats.map((c) => ({ n: c, cls: c === sel ? 'on' : '', pick: () => this.setState({ cat: c }) })),
      items: P.filter((p) => sel === 'همه' || p[2] === sel).map((p) => ({ n: p[1], price: fmt(p[3]), has: !!q[p[0]], q: fa(q[p[0]] || 0), add: add(p[0]) })),
      tbl: this.state.tb ? fa(this.state.tb) : 'بدون میز', tless: () => this.setState({ tb: Math.max(0, this.state.tb - 1) }), tmore: () => this.setState({ tb: this.state.tb + 1 }),
      cart, empty: cart.length === 0, total: fmt(total) + ' تومان', clear: () => this.setState({ q: {} })
    };
  }
}
</script>
</body>
</html>
