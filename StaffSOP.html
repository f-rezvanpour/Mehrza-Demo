<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>دستورالعمل‌ها</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="./dc-lite.js" defer></script>
<style>html{background:#0b0705}@media(min-width:520px){body{display:flex;justify-content:center;padding:24px 0;min-height:100vh;box-sizing:border-box}x-dc{border-radius:38px;overflow:hidden;box-shadow:0 0 0 8px #1d1510,0 30px 80px rgba(0,0,0,.6);height:844px}}x-dc{display:block}</style>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0}

</style>
</helmet>
<div class="app a-vio" dir="rtl">
  <div class="glow"></div>
  <div class="bar rise">
    <a class="back tap" href="StaffHome.html" aria-label="بازگشت"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    <div class="f1"><h1 class="ttl">دستورالعمل‌ها</h1><div class="sub t12 m">جست‌وجو و تایید مطالعه</div></div>
  </div>
  <div class="scroll">
    <div class="card rise d1" style="padding:10px 14px"><div class="fx ai g10"><svg class="i m" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input type="text" placeholder="جست‌وجو، مثلا اسپرسو" aria-label="جست‌وجو" style="flex:1;background:none;border:0;outline:0;color:var(--tx);font:inherit;font-size:15px" onInput="{{onSearch}}"></div></div>
    <sc-for list="{{docs}}" as="d" hint-placeholder-count="5">
      <a href="StaffSOPRead.html" class="item tap">
        <span class="blob"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7"/></svg></span>
        <div class="f1"><b class="t14 w8">{{d.title}}</b><div class="t12 m">{{d.ver}}</div></div>
        <span class="pill {{d.pc}}">{{d.st}}</span>
      </a>
    </sc-for>
    <sc-if value="{{empty}}" hint-placeholder-val="{{false}}"><div class="card tc m">موردی پیدا نشد</div></sc-if>
  </div>
  <nav class="dock" aria-label="ناوبری کارمند">
    <a href="StaffHome.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg></span>خانه</a>
    <a href="StaffOrders.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 9h6M9 13h6M9 17h3"/></svg></span>سفارش‌ها</a>
    <a href="StaffAttend.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg></span>حضور</a>
    <a href="StaffShifts.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></span>شیفت</a>
    <a href="StaffMe.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-6 8-6s8 2 8 6"/></svg></span>من</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { q: '' }; }
  renderVals() {
    const all = [
      { title: 'تمیزکاری دستگاه اسپرسو', ver: 'نسخه ۳٫۲، تغییر جدید', st: 'تایید کن', pc: 'p-warn' },
      { title: 'دستور تهیه اسپرسو', ver: 'نسخه ۲٫۰', st: 'خوانده شد', pc: 'p-ok' },
      { title: 'باز و بستن صندوق', ver: 'نسخه ۱٫۴', st: 'خوانده شد', pc: 'p-ok' },
      { title: 'بهداشت و ایمنی غذا', ver: 'نسخه ۲٫۱', st: 'خوانده شد', pc: 'p-ok' },
      { title: 'برخورد با مشتری ناراضی', ver: 'نسخه ۱٫۰', st: 'تایید کن', pc: 'p-warn' }
    ];
    const q = this.state.q.trim();
    const docs = all.filter((d) => d.title.indexOf(q) !== -1);
    return { docs, empty: docs.length === 0, onSearch: (e) => this.setState({ q: e.target.value }) };
  }
}
</script>
</body>
</html>
