<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>انبار حرفه‌ای</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="./dc-lite.js" defer></script>
<style>html{background:#0b0705}@media(min-width:520px){body{display:flex;justify-content:center;padding:24px 0;min-height:100vh;box-sizing:border-box}x-dc{border-radius:38px;overflow:hidden;box-shadow:0 0 0 8px #1d1510,0 30px 80px rgba(0,0,0,.6);height:844px}}x-dc{display:block}</style>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
.fld{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--mut);font-weight:600}
.fld input,.fld select{height:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--card2);color:var(--tx);padding:0 14px;font:inherit;font-size:15px;outline:0;width:100%;box-sizing:border-box}
.fld input:focus,.fld select:focus{border-color:var(--ac)}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--mut);font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.tabs button.on{border-color:var(--ac);color:var(--ac)}
.stp{display:flex;align-items:center;gap:8px}
.stp button{width:34px;height:34px;border-radius:11px;border:1.5px solid var(--line);background:var(--card2);color:var(--tx);font:inherit;font-size:18px;font-weight:900;cursor:pointer}
.stp b{min-width:28px;text-align:center}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;color:var(--mut);font-weight:700;text-align:right;padding:6px 4px}
.tbl td{padding:9px 4px;border-top:1px solid var(--line)}
.tbl .n{text-align:left;direction:ltr;font-weight:800}
.cat{flex:none;height:36px;padding:0 14px;border-radius:18px;border:1.5px solid var(--line);background:var(--card);color:var(--mut);font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.cat.on{border-color:var(--ac);color:var(--ac)}
</style>
</helmet>
<div class="app a-gold" dir="rtl">
  <div class="glow"></div>
  <div class="bar rise">
    <a class="back tap" href="Main.html" aria-label="بازگشت"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    <div class="f1"><h1 class="ttl">انبار حرفه‌ای</h1><div class="sub t12 m">کاردکس و بهای میانگین موزون</div></div><a href="InvReceipt.html" class="chip tap" style="border-color:#E8B25C;color:#E8B25C">+ رسید</a>
  </div>
  <div class="scroll">
    <div class="fx g8 rise d1" style="overflow-x:auto"><sc-for list="{{cats}}" as="c" hint-placeholder-count="4"><button type="button" class="cat tap {{c.cls}}" onClick="{{c.pick}}">{{c.n}}</button></sc-for></div>
    <div class="card hero rise d2"><div class="grid3" style="gap:8px;text-align:center"><div><div class="t11 m">موجودی</div><div class="t18 w9">{{stock}}</div></div><div><div class="t11 m">بهای میانگین</div><div class="t18 w9">{{avg}}</div></div><div><div class="t11 m">ارزش</div><div class="t18 w9 gold">{{val}}</div></div></div>
      <div class="fx ai jb" style="margin-top:10px"><span class="t12 m">{{unit}}</span><span class="pill {{pc}}">{{pt}}</span></div></div>
    <div class="fx ai jb rise d3"><h2 class="h2">گردش کالا</h2><span class="t12 m">از آخر به اول</span></div>
    <div class="card rise d4" style="padding:6px 14px"><table class="tbl"><thead><tr><th>شرح</th><th class="n">تعداد</th><th class="n">مانده</th></tr></thead><tbody>
      <sc-for list="{{mv}}" as="m" hint-placeholder-count="5"><tr><td>{{m.t}}</td><td class="n">{{m.q}}</td><td class="n">{{m.b}}</td></tr></sc-for>
    </tbody></table></div>
    <div class="fx g10 rise d5"><a href="InvReceipt.html" class="btn tap">رسید خرید</a><a href="InvCount.html" class="btn ghost tap">انبارگردانی</a></div>
    <div class="grid2 rise d6"><a href="Suppliers.html" class="item tap"><b class="t13 w8">تامین‌کنندگان</b></a><a href="InvReorder.html" class="item tap"><b class="t13 w8">پیشنهاد خرید</b></a><a href="InvExpiry.html" class="item tap"><b class="t13 w8">انقضا</b></a><a href="InvWaste.html" class="item tap"><b class="t13 w8">ضایعات</b></a><a href="InvTransfer.html" class="item tap"><b class="t13 w8">انتقال شعبه</b></a><a href="PurchaseOrder.html" class="item tap"><b class="t13 w8">سفارش خرید</b></a></div>
  </div>
  <nav class="dock" aria-label="ناوبری">
    <a href="Main.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg></span>خانه</a>
    <a href="AcctHome.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></span>حسابداری</a>
    <a href="InvKardex.html" class="on"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5L12 12l9-4.5M12 12v9"/></svg></span>انبار</a>
    <a href="ProdList.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h13v5a5 5 0 01-5 5H9a5 5 0 01-5-5z"/><path d="M17 9h2a2 2 0 010 4h-2"/></svg></span>محصولات</a>
    <a href="Branches.html"><span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10l1-5h14l1 5"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg></span>شعبه‌ها</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { i: 0 }; }
  renderVals() {
    const fa = (n) => String(n).replace(/\d/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]);
    const fmt = (n) => fa(Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '٬'));
    const I = [
      { n: 'دان قهوه', u: 'گرم', avg: 1200, stock: 12400, min: 3000, mv: [['فروش ۱۰۴۲ لاته', -18], ['فروش ۱۰۴۲ آمریکانو', -18], ['تعدیل انبارگردانی', -64], ['موجودی ابتدای دوره', 12500]] },
      { n: 'شیر', u: 'میلی‌لیتر', avg: 60, stock: 48000, min: 10000, mv: [['فروش ۱۰۴۱ کاپوچینو ×۲', -240], ['فروش ۱۰۴۲ لاته', -200], ['موجودی', 48440]] },
      { n: 'لیوان', u: 'عدد', avg: 3000, stock: 640, min: 600, mv: [['فروش ۱۰۴۱ ×۲', -2], ['فروش ۱۰۴۲ ×۲', -2], ['موجودی', 644]] },
      { n: 'درب', u: 'عدد', avg: 1500, stock: 700, min: 300, mv: [['فروش ۱۰۴۱ ×۲', -2], ['فروش ۱۰۴۲ ×۲', -2], ['موجودی', 704]] }
    ];
    const i = this.state.i, it = I[i];
    let bal = it.stock;
    const rows = it.mv.map((m) => { const r = { t: m[0], q: (m[1] > 0 ? '+' : '') + fa(m[1]).replace('-', '−'), b: fmt(bal) }; bal -= m[1]; return r; });
    const low = it.stock < it.min * 1.1;
    return {
      cats: I.map((x, k) => ({ n: x.n, cls: k === i ? 'on' : '', pick: () => this.setState({ i: k }) })),
      stock: fmt(it.stock), avg: fmt(it.avg), val: fmt(it.stock * it.avg),
      unit: 'واحد: ' + it.u + '، ارزش به تومان', pc: low ? 'p-warn' : 'p-ok', pt: low ? 'نزدیک حداقل' : 'کافی', mv: rows
    };
  }
}
</script>
</body>
</html>
